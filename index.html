const EXCLUDED_PROJECT_LABELS = new Set([

  "SERVICO INTERNO", "SERVIÇO INTERNO", "REUNIAO DE EQUIPE",

let PLACEHOLDER_PROJ_IDX = new Set();
function recomputePlaceholderProjIdx() {
  PLACEHOLDER_PROJ_IDX = new Set(
    RAW.projetos
      .map((p, i) => [(p || "").trim().toUpperCase(), i])
      .filter(([p]) => EXCLUDED_PROJECT_LABELS.has(p))
      .map(([, i]) => i)

}

// ---------- Conexão com o Supabase (banco da MATRIZ) ----------
const SUPABASE_URL = "https://tvvxiypewbephjvonwds.supabase.co";
const SUPABASE_KEY = "sb_publishable_t5s5ev6j_npbkE9DokHPAA_5ILdCtiy";
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

async function carregarDadosSupabase() {
  let todos = [];
  let from = 0;
  const pageSize = 1000;
  while (true) {
    const { data, error } = await sb
      .from("registros")
      .select("colaborador,obra,data,horas,setor,disciplina,tarefa")
      .range(from, from + pageSize - 1);
    if (error) throw error;
    if (!data || data.length === 0) break;
    todos = todos.concat(data);
    if (data.length < pageSize) break;
    from += pageSize;
  }

  const uniqueSorted = (arr) =>
    Array.from(new Set(arr.filter((v) => v !== null && v !== undefined && v !== "")))
      .sort((a, b) => String(a).localeCompare(String(b), "pt-BR"));

  const colaboradores = uniqueSorted(todos.map((r) => r.colaborador));
  const setores = uniqueSorted(todos.map((r) => r.setor));
  const projetos = uniqueSorted(todos.map((r) => r.obra));
  const disciplinas = uniqueSorted(todos.map((r) => r.disciplina));
  const tarefas = uniqueSorted(todos.map((r) => r.tarefa));

  const idxOf = (arr) => {
    const m = new Map();
    arr.forEach((v, i) => m.set(v, i));
    return m;
  };
  const colabIdx = idxOf(colaboradores);
  const setorIdx = idxOf(setores);
  const projIdx = idxOf(projetos);
  const discIdx = idxOf(disciplinas);
  const tarefaIdx = idxOf(tarefas);

  const rows = todos.map((r) => {
    const dateInt = r.data ? parseInt(String(r.data).replace(/-/g, ""), 10) : 0;
    const horas = Number(r.horas) || 0;
    return [
      dateInt,
      r.colaborador ? (colabIdx.has(r.colaborador) ? colabIdx.get(r.colaborador) : -1) : -1,
      r.setor ? (setorIdx.has(r.setor) ? setorIdx.get(r.setor) : -1) : -1,
      r.obra ? (projIdx.has(r.obra) ? projIdx.get(r.obra) : -1) : -1,
      r.disciplina ? (discIdx.has(r.disciplina) ? discIdx.get(r.disciplina) : -1) : -1,
      r.tarefa ? (tarefaIdx.has(r.tarefa) ? tarefaIdx.get(r.tarefa) : -1) : -1,
      horas,
      0, 0, 0,
    ];
  });

  RAW = { colaboradores, setores, projetos, disciplinas, tarefas, tipos: ["Produtiva"], rows };
  recomputePlaceholderProjIdx();
}

const MONTH_ABBR = ["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"];
const monthKey = (dateint) => Math.floor(dateint / 100);
const monthLabel = (ym) => `${MONTH_ABBR[(ym % 100) - 1]}/${String(ym / 100 | 0).slice(-2)}`;
const dateFromInt = (di) => {
  const y = Math.floor(di / 10000), m = Math.floor((di % 10000) / 100), d = di % 100;
  return `${String(d).padStart(2, "0")}/${String(m).padStart(2, "0")}/${y}`;
};

const fmtH = (h) => (h || 0).toLocaleString("pt-BR", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const fmtBRL = (v) => (v || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL", maximumFractionDigits: 0 });
const fmtPct = (v) => (isFinite(v) ? (v * 100).toLocaleString("pt-BR", { maximumFractionDigits: 1 }) : "0") + "%";

const TIPO_COLORS = {
  0: "#3E7CB1", 1: "#C97A2B", 2: "#B0562F", 3: "#8B6F47", 4: "#A13D3D",
  5: "#5C8A5C", 6: "#8B3A3A", 7: "#5B7DB1", 8: "#7A6A8A", 9: "#4A7A6A", 10: "#767676",
};
const PALETTE = ["#2E5C8A", "#C97A2B", "#5C8A5C", "#A13D3D", "#7A6A8A", "#4A7A6A", "#B0562F", "#3E7CB1", "#8B6F47", "#767676", "#5B7DB1", "#8B3A3A"];

const ZERO_COST_TIPOS = new Set([5, 7, 9]); 
const PRODUCTIVE_TIPOS = new Set([1, 2, 8]); 

function isProdRow(r) { return r[7] === 0 || PRODUCTIVE_TIPOS.has(r[7]); }

function rowCusto(r, custoMap) {
  if (ZERO_COST_TIPOS.has(r[7])) return { custo: 0, isProdCost: true };
  const custoHora = custoMap[RAW.colaboradores[r[1]]] || 0;
  const custo = r[6] * custoHora;
  return { custo, isProdCost: isProdRow(r) };
}

function aggregateBy(rows, keyFn, custoMap, includeIdx) {
  const map = new Map();
  for (const r of rows) {
    const key = keyFn(r);
    if (key === null || key === undefined) continue;
    if (!map.has(key)) {
      map.set(key, {
        horas: 0, prod: 0, naoProd: 0, custo: 0, custoProd: 0, custoNaoProd: 0,
        colabs: new Set(), dias: new Set(), projetos: new Set(), n: 0,
      });
    }
    const g = map.get(key);
    const { custo, isProdCost } = rowCusto(r, custoMap);
    const prodHoras = isProdRow(r);
    g.horas += r[6];
    g.n += 1;
    if (prodHoras) { g.prod += r[6]; } else { g.naoProd += r[6]; }
    if (isProdCost) { g.custoProd += custo; } else { g.custoNaoProd += custo; }
    g.custo += custo;
    g.colabs.add(r[1]);
    g.dias.add(r[0]);
    g.projetos.add(r[3]);
  }
  return map;
}

function mapToArr(map, nameOf) {
  return Array.from(map.entries()).map(([key, g]) => ({
    key, nome: nameOf(key), horas: g.horas, prod: g.prod, naoProd: g.naoProd,
    custo: g.custo, custoProd: g.custoProd, custoNaoProd: g.custoNaoProd,
    nColabs: g.colabs.size, nDias: g.dias.size, nProjetos: g.projetos.size, n: g.n,
    produtividade: g.horas ? g.prod / g.horas : 0,
    mediaHorasDia: g.dias.size ? g.horas / g.dias.size : 0,
  }));
}

function KpiCard({ label, value, sub, accent }) {

function Section({ title, children, right }) {

function DataTable({ columns, rows, maxRows = 25 }) {
  const shown = rows.slice(0, maxRows);
  return (
    <div style={{ overflowX: "auto", border: "1px solid #263241", borderRadius: 3 }}>
      <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 12.5 }}>
        <thead>
          <tr style={{ background: "#141a22" }}>
            {columns.map((c) => (
              <th key={c.key} style={{
                textAlign: c.align || "left", padding: "8px 10px", color: "#7c8ba1",
                fontWeight: 600, fontSize: 10.5, letterSpacing: 0.4, textTransform: "uppercase",
                borderBottom: "1px solid #263241", whiteSpace: "nowrap",
              }}>{c.label}</th>
            ))}
          </tr>
        </thead>
        <tbody>
          {shown.map((row, i) => (
            <tr key={i} style={{ borderBottom: "1px solid #1c242e" }}>
              {columns.map((c) => (
                <td key={c.key} style={{
                  padding: "7px 10px", color: c.mono ? "#c3cee0" : "#dbe2ec",
                  fontFamily: c.mono ? "'JetBrains Mono', Consolas, monospace" : "inherit",
                  textAlign: c.align || "left", whiteSpace: "nowrap",
                }}>{c.render ? c.render(row) : row[c.key]}</td>
              ))}
            </tr>
          ))}
        </tbody>
      </table>
      {rows.length > maxRows && (
        <div style={{ padding: "6px 10px", fontSize: 11, color: "#5c6b80" }}>
          mostrando {maxRows} de {rows.length}
        </div>
      )}
    </div>
  );
}

function MultiSelect({ label, options, selected, onChange }) {
  const [open, setOpen] = useState(false);
  const [q, setQ] = useState("");
  const filtered = q ? options.filter((o) => o.label.toUpperCase().includes(q.toUpperCase())) : options;
  const toggle = (idx) => {
    const next = new Set(selected);
    if (next.has(idx)) next.delete(idx); else next.add(idx);
    onChange(next);
  };
  return (
    <div style={{ position: "relative" }}>
      <button onClick={() => setOpen((v) => !v)} style={{
        background: selected.size ? "#1d2c3f" : "#141a22", border: "1px solid #2c3a4d", color: "#dbe2ec",
        borderRadius: 3, padding: "7px 10px", fontSize: 12, cursor: "pointer", minWidth: 130, textAlign: "left",
      }}>
        {label}{selected.size ? ` (${selected.size})` : ""} ▾
      </button>
      {open && (
        <div style={{
          position: "absolute", top: "110%", left: 0, zIndex: 20, background: "#141a22",
          border: "1px solid #2c3a4d", borderRadius: 4, width: 260, maxHeight: 320, display: "flex",
          flexDirection: "column", boxShadow: "0 8px 24px rgba(0,0,0,.4)",
        }}>
          <div style={{ padding: 8, borderBottom: "1px solid #263241" }}>
            <input value={q} onChange={(e) => setQ(e.target.value)} placeholder="buscar..."
              style={{ width: "100%", background: "#0c1016", border: "1px solid #263241", borderRadius: 3, color: "#dbe2ec", padding: "5px 7px", fontSize: 12 }} />
          </div>
          <div style={{ overflowY: "auto", padding: 4 }}>
            {filtered.slice(0, 400).map((o) => (
              <label key={o.value} style={{ display: "flex", gap: 7, alignItems: "center", padding: "4px 6px", fontSize: 12.5, color: "#dbe2ec", cursor: "pointer" }}>
                <input type="checkbox" checked={selected.has(o.value)} onChange={() => toggle(o.value)} />
                <span style={{ overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{o.label}</span>
              </label>
            ))}
            {filtered.length === 0 && <div style={{ padding: 8, fontSize: 12, color: "#5c6b80" }}>nenhum resultado</div>}
          </div>
          <div style={{ display: "flex", justifyContent: "space-between", padding: 8, borderTop: "1px solid #263241" }}>
            <button onClick={() => onChange(new Set())} style={btnGhost}>limpar</button>
            <button onClick={() => setOpen(false)} style={btnPrimary}>fechar</button>
          </div>
        </div>
      )}
    </div>
  );
}

const btnGhost = { background: "transparent", border: "1px solid #2c3a4d", color: "#9fb0c6", borderRadius: 3, padding: "5px 10px", fontSize: 11.5, cursor: "pointer" };
const btnPrimary = { background: "#2E5C8A", border: "1px solid #3E7CB1", color: "#eaf1fb", borderRadius: 3, padding: "5px 10px", fontSize: 11.5, cursor: "pointer" };
const btnSuccess = { background: "#3d7e52", border: "1px solid #4a9e66", color: "#eaf1fb", borderRadius: 3, padding: "5px 10px", fontSize: 11.5, cursor: "pointer" };
const btnDanger = { background: "#A13D3D", border: "1px solid #b54a4a", color: "#eaf1fb", borderRadius: 3, padding: "5px 10px", fontSize: 11.5, cursor: "pointer" };

const NAV = [
  ["dashboard", "Dashboard"], ["projetos", "Projetos"], ["funcionarios", "Funcionários"],
  ["improdutivo", "Tempo Indireto"], ["custos", "Custos"], ["mensal", "Mensal"],
  ["setores", "Setores"], ["disciplinas", "Disciplinas"], ["tarefas", "Tarefas"],
  ["alertas", "Alertas"], ["custohora", "Custo/Hora"], ["revisao", "Revisão"],
];

export default function App() {
  const [view, setView] = useState("dashboard");
  const [filters, setFilters] = useState({
    dateFrom: "", dateTo: "", colab: new Set(), setor: new Set(), projeto: new Set(),
    disciplina: new Set(), tipo: new Set(), tarefaSearch: "",
  });
  const [custoMap, setCustoMap] = useState({});
  const [custoLoaded, setCustoLoaded] = useState(false);
  const [thresholds, setThresholds] = useState({ improdutivoPct: 30, hhMultiplicador: 2, produtividadeMin: 70, horasDiaMax: 10 });

  const [session, setSession] = useState(null);
  const [authChecking, setAuthChecking] = useState(true);
  const [dataLoading, setDataLoading] = useState(false);
  const [dataError, setDataError] = useState(null);
  const [dataVersion, setDataVersion] = useState(0);
  const [ultimaAtualizacao, setUltimaAtualizacao] = useState(null);
  const [atualizandoManual, setAtualizandoManual] = useState(false);
  const [erroAtualizar, setErroAtualizar] = useState("");
  const [loginEmail, setLoginEmail] = useState("");
  const [loginSenha, setLoginSenha] = useState("");
  const [loginErro, setLoginErro] = useState("");
  const [loginCarregando, setLoginCarregando] = useState(false);

  useEffect(() => {
    let mounted = true;
    sb.auth.getSession().then(({ data }) => {
      if (!mounted) return;
      setSession(data.session);
      setAuthChecking(false);
    });
    const { data: listener } = sb.auth.onAuthStateChange((_event, newSession) => {
      setSession(newSession);
    });
    return () => { mounted = false; listener.subscription.unsubscribe(); };
  }, []);

  useEffect(() => {
    if (!session) return;
    let mounted = true;
    (async () => {
      setDataLoading(true);
      setDataError(null);
      try {
        await carregarDadosSupabase();
        if (mounted) {
          setDataVersion((v) => v + 1);
          setUltimaAtualizacao(new Date());
        }
      } catch (e) {
        if (mounted) setDataError((e && e.message) || "Erro ao carregar os dados do banco.");
      }
      if (mounted) setDataLoading(false);
    })();
    return () => { mounted = false; };
  }, [session]);

  async function atualizarDadosManual() {
    setAtualizandoManual(true);
    setErroAtualizar("");
    try {
      await carregarDadosSupabase();
      setDataVersion((v) => v + 1);
      setUltimaAtualizacao(new Date());
    } catch (e) {
      setErroAtualizar((e && e.message) || "Erro ao atualizar os dados.");
    }
    setAtualizandoManual(false);
  }

  const fmtUltimaAtualizacao = (d) => {
    if (!d) return "";
    const pad = (n) => String(n).padStart(2, "0");
    return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()} às ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  };

  async function handleLogin(e) {
    e.preventDefault();
    setLoginErro("");
    setLoginCarregando(true);
    const { error } = await sb.auth.signInWithPassword({ email: loginEmail, password: loginSenha });
    setLoginCarregando(false);
    if (error) setLoginErro(error.message === "Invalid login credentials" ? "E-mail ou senha inválidos." : error.message);
  }

  const pageWrapStyle = { fontFamily: "'Inter', 'Helvetica Neue', Arial, sans-serif", background: "#0c1016", color: "#dbe2ec", minHeight: "100vh", padding: 16, display: "flex", alignItems: "center", justifyContent: "center" };

  useEffect(() => {
    try {
      const raw = localStorage.getItem("custo_hora_colaboradores");
      if (raw) setCustoMap(JSON.parse(raw));
    } catch (e) {}
    setCustoLoaded(true);
  }, []);

  const updateCusto = useCallback((nome, valor) => {
    setCustoMap((prev) => {
      const next = { ...prev, [nome]: valor };
      try { localStorage.setItem("custo_hora_colaboradores", JSON.stringify(next)); } catch (e) {}
      return next;
    });
  }, []);

  // Nova função para salvar múltiplos dados com segurança
  const updateCustoEmMassa = useCallback((novosCustos) => {
    setCustoMap((prev) => {
      const next = { ...prev, ...novosCustos };
      try { localStorage.setItem("custo_hora_colaboradores", JSON.stringify(next)); } catch (e) {}
      return next;
    });
  }, []);

  const hasCusto = Object.keys(custoMap).length > 0;

  const dateFromInt2 = (s) => s ? parseInt(s.replace(/-/g, ""), 10) : null;

  const filteredRows = useMemo(() => {
    const df = dateFromInt2(filters.dateFrom);
    const dt = dateFromInt2(filters.dateTo);
    const tSearch = filters.tarefaSearch.trim().toUpperCase();
    return RAW.rows.filter((r) => {
      if (df && r[0] < df) return false;
      if (dt && r[0] > dt) return false;
      if (filters.colab.size && !filters.colab.has(r[1])) return false;
      if (filters.setor.size && !filters.setor.has(r[2])) return false;
      if (filters.projeto.size && !filters.projeto.has(r[3])) return false;
      if (filters.disciplina.size && !filters.disciplina.has(r[4])) return false;
      if (filters.tipo.size && !filters.tipo.has(r[7])) return false;
      if (tSearch && (r[5] === -1 || !RAW.tarefas[r[5]].toUpperCase().includes(tSearch))) return false;
      return true;
    });
  }, [filters, dataVersion]);

  const kpis = useMemo(() => {
    let horas = 0, prod = 0, custo = 0, custoProd = 0, custoNaoProd = 0;
    const colabs = new Set(), setores = new Set(), projetos = new Set(), discs = new Set();
    for (const r of filteredRows) {
      horas += r[6];
      const { custo: c, isProdCost } = rowCusto(r, custoMap);
      custo += c;
      if (isProdRow(r)) prod += r[6];
      if (isProdCost) custoProd += c; else custoNaoProd += c;
      colabs.add(r[1]); setores.add(r[2]); discs.add(r[4]);
      if (!PLACEHOLDER_PROJ_IDX.has(r[3])) projetos.add(r[3]);
    }
    const naoProd = horas - prod;
    return { horas, prod, naoProd, custo, custoProd, custoNaoProd, colabs: colabs.size, setores: setores.size, projetos: projetos.size, discs: discs.size };
  }, [filteredRows, custoMap, dataVersion]);

  const opt = (arr, excludeSet) => arr.map((v, i) => [v, i]).filter(([, i]) => !excludeSet || !excludeSet.has(i)).map(([v, i]) => ({ label: v, value: i }));

  if (authChecking) {
    return <div style={pageWrapStyle}>Verificando login...</div>;
  }

  if (!session) {
    return (
      <div style={pageWrapStyle}>
        <form onSubmit={handleLogin} style={{ background: "#10151d", border: "1px solid #1c242e", borderRadius: 6, padding: 24, width: 320 }}>
          <h2 style={{ margin: "0 0 4px", fontSize: 16, color: "#eef2f8" }}>Painel de Produtividade</h2>
          <div style={{ fontSize: 12, color: "#5c6b80", marginBottom: 16 }}>Entre com sua conta do sistema de registro de horas (matriz).</div>
          <label style={{ display: "block", fontSize: 11.5, color: "#9fb0c6", marginBottom: 4 }}>E-MAIL</label>
          <input type="email" required value={loginEmail} onChange={(e) => setLoginEmail(e.target.value)}
            style={{ width: "100%", background: "#141a22", border: "1px solid #2c3a4d", borderRadius: 3, color: "#dbe2ec", padding: "8px 10px", fontSize: 13, marginBottom: 12, boxSizing: "border-box" }} />
          <label style={{ display: "block", fontSize: 11.5, color: "#9fb0c6", marginBottom: 4 }}>SENHA</label>
          <input type="password" required value={loginSenha} onChange={(e) => setLoginSenha(e.target.value)}
            style={{ width: "100%", background: "#141a22", border: "1px solid #2c3a4d", borderRadius: 3, color: "#dbe2ec", padding: "8px 10px", fontSize: 13, marginBottom: 16, boxSizing: "border-box" }} />
          <button type="submit" disabled={loginCarregando} style={{ width: "100%", background: "#2E5C8A", color: "#eaf1fb", border: "1px solid #3E7CB1", borderRadius: 3, padding: "9px 0", fontSize: 13, fontWeight: 600, cursor: "pointer" }}>
            {loginCarregando ? "Entrando..." : "Entrar"}
          </button>
          {loginErro && <div style={{ marginTop: 12, fontSize: 12, color: "#e08787" }}>{loginErro}</div>}
        </form>
      </div>
    );
  }

  if (dataLoading && dataVersion === 0) {
    return <div style={pageWrapStyle}>Carregando registros de horas do banco...</div>;
  }

  if (dataError) {
    return (
      <div style={pageWrapStyle}>
        <div style={{ maxWidth: 420, textAlign: "center" }}>
          <div style={{ fontSize: 14, color: "#e08787", marginBottom: 10 }}>Não foi possível carregar os dados.</div>
          <div style={{ fontSize: 12, color: "#9fb0c6" }}>{dataError}</div>
        </div>
      </div>
    );
  }

  return (
    <div style={{ fontFamily: "'Inter', 'Helvetica Neue', Arial, sans-serif", background: "#0c1016", color: "#dbe2ec", minHeight: "100%", padding: 16 }}>
      <div style={{ display: "flex", alignItems: "baseline", gap: 10, marginBottom: 4, flexWrap: "wrap" }}>
        <h1 style={{ margin: 0, fontSize: 18, fontWeight: 700, color: "#eef2f8", letterSpacing: 0.2 }}>Painel de Produtividade e Custos</h1>
        <span style={{ fontSize: 11.5, color: "#5c6b80" }}>{RAW.rows.length.toLocaleString("pt-BR")} apontamentos · {RAW.colaboradores.length} colaboradores · {RAW.setores.length} setores</span>
        <span style={{ marginLeft: "auto", display: "flex", alignItems: "center", gap: 8 }}>
          <span style={{ fontSize: 11, color: "#5c6b80" }}>
            {ultimaAtualizacao ? `Última atualização: ${fmtUltimaAtualizacao(ultimaAtualizacao)}` : ""}
          </span>
          <button onClick={atualizarDadosManual} disabled={atualizandoManual} style={{
            background: "#141a22", color: "#dbe2ec", border: "1px solid #2c3a4d", borderRadius: 3,
            padding: "6px 11px", fontSize: 12, cursor: atualizandoManual ? "default" : "pointer",
            opacity: atualizandoManual ? 0.6 : 1,
          }}>
            {atualizandoManual ? "Atualizando..." : "⟳ Atualizar dados"}
          </button>
        </span>
      </div>
      {erroAtualizar && (
        <div style={{ fontSize: 11.5, color: "#e08787", marginBottom: 6 }}>{erroAtualizar}</div>
      )}
      <div style={{ fontSize: 11.5, color: "#5c6b80", marginBottom: 14 }}>
        {!hasCusto && "Cadastre o custo/hora em \"Custo/Hora\" para habilitar os indicadores financeiros. "}
        Base: exportação de apontamento de horas por setor.
      </div>

      <div style={{ display: "flex", gap: 4, flexWrap: "wrap", marginBottom: 14, borderBottom: "1px solid #1c242e", paddingBottom: 10 }}>
        {NAV.map(([k, label]) => (
          <button key={k} onClick={() => setView(k)} style={{
            background: view === k ? "#2E5C8A" : "transparent", color: view === k ? "#eaf1fb" : "#9fb0c6",
            border: view === k ? "1px solid #3E7CB1" : "1px solid transparent", borderRadius: 3,
            padding: "6px 11px", fontSize: 12.5, cursor: "pointer", fontWeight: view === k ? 600 : 400,
          }}>{label}</button>
        ))}
      </div>

      {view !== "custohora" && (
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center", marginBottom: 18, padding: 10, background: "#10151d", border: "1px solid #1c242e", borderRadius: 4 }}>
          <input type="date" value={filters.dateFrom} onChange={(e) => setFilters((f) => ({ ...f, dateFrom: e.target.value }))}
            style={{ background: "#141a22", border: "1px solid #2c3a4d", borderRadius: 3, color: "#dbe2ec", padding: "6px 8px", fontSize: 12 }} />
          <span style={{ color: "#5c6b80", fontSize: 12 }}>até</span>
          <input type="date" value={filters.dateTo} onChange={(e) => setFilters((f) => ({ ...f, dateTo: e.target.value }))}
            style={{ background: "#141a22", border: "1px solid #2c3a4d", borderRadius: 3, color: "#dbe2ec", padding: "6px 8px", fontSize: 12 }} />
          <MultiSelect label="Colaborador" options={opt(RAW.colaboradores)} selected={filters.colab} onChange={(s) => setFilters((f) => ({ ...f, colab: s }))} />
          <MultiSelect label="Setor" options={opt(RAW.setores)} selected={filters.setor} onChange={(s) => setFilters((f) => ({ ...f, setor: s }))} />
          <MultiSelect label="Projeto" options={opt(RAW.projetos)} selected={filters.projeto} onChange={(s) => setFilters((f) => ({ ...f, projeto: s }))} />
          <MultiSelect label="Disciplina" options={opt(RAW.disciplinas)} selected={filters.disciplina} onChange={(s) => setFilters((f) => ({ ...f, disciplina: s }))} />
          <MultiSelect label="Tipo de Hora" options={RAW.tipos.map((t, i) => ({ label: t, value: i }))} selected={filters.tipo} onChange={(s) => setFilters((f) => ({ ...f, tipo: s }))} />
          <input placeholder="buscar tarefa..." value={filters.tarefaSearch} onChange={(e) => setFilters((f) => ({ ...f, tarefaSearch: e.target.value }))}
            style={{ background: "#141a22", border: "1px solid #2c3a4d", borderRadius: 3, color: "#dbe2ec", padding: "6px 8px", fontSize: 12, width: 150 }} />
          <button onClick={() => setFilters({ dateFrom: "", dateTo: "", colab: new Set(), setor: new Set(), projeto: new Set(), disciplina: new Set(), tipo: new Set(), tarefaSearch: "" })}
            style={btnGhost}>limpar filtros</button>
          <span style={{ marginLeft: "auto", fontSize: 11.5, color: "#5c6b80" }}>{filteredRows.length.toLocaleString("pt-BR")} registros no filtro</span>
        </div>
      )}

      {view === "dashboard" && <DashboardView filteredRows={filteredRows} kpis={kpis} custoMap={custoMap} hasCusto={hasCusto} />}
      {view === "projetos" && <ProjetosView filteredRows={filteredRows} custoMap={custoMap} hasCusto={hasCusto} />}
      {view === "funcionarios" && <FuncionariosView filteredRows={filteredRows} custoMap={custoMap} hasCusto={hasCusto} />}
      {view === "improdutivo" && <ImprodutivoView filteredRows={filteredRows} custoMap={custoMap} hasCusto={hasCusto} />}
      {view === "custos" && <CustosView filteredRows={filteredRows} custoMap={custoMap} hasCusto={hasCusto} />}
      {view === "mensal" && <MensalView filteredRows={filteredRows} custoMap={custoMap} hasCusto={hasCusto} />}
      {view === "setores" && <SetoresView filteredRows={filteredRows} custoMap={custoMap} hasCusto={hasCusto} />}
      {view === "disciplinas" && <DisciplinasView filteredRows={filteredRows} custoMap={custoMap} hasCusto={hasCusto} />}
      {view === "tarefas" && <TarefasView filteredRows={filteredRows} custoMap={custoMap} hasCusto={hasCusto} />}
      {view === "alertas" && <AlertasView filteredRows={filteredRows} custoMap={custoMap} hasCusto={hasCusto} thresholds={thresholds} setThresholds={setThresholds} />}
      
      {/* ABA CUSTO/HORA REDESENHADA ABAIXO */}
      {view === "custohora" && <CustoHoraView custoMap={custoMap} updateCusto={updateCusto} updateCustoEmMassa={updateCustoEmMassa} loaded={custoLoaded} opt={opt} />}
      
      {view === "revisao" && <RevisaoView />}

      <div style={{ marginTop: 26, paddingTop: 14, borderTop: "1px solid #1c242e", fontSize: 11, color: "#4a5668", lineHeight: 1.6 }}>
        Campos recomendados para ampliar a análise: custo/hora por colaborador (cadastrar na aba própria), horas previstas e custo previsto por projeto,
        código e cliente do projeto, status e datas de início/término previstas, cargo/função do colaborador. A coluna "Observação" foi lida automaticamente
        quando trazia uma quantidade explícita (ex.: "30 minutos em gestão"); os demais casos ambíguos estão listados na aba Revisão.
      </div>
    </div>
  );
}

// NOVA ABA DE CUSTO/HORA - ATUALIZADA COM EDIÇÃO EM MASSA E FILTROS
// ==============================================================
function CustoHoraView({ custoMap, updateCusto, updateCustoEmMassa, loaded, opt }) {
  // 1. Estados
  const [q, setQ] = useState("");
  const [filtros, setFiltros] = useState({ setor: new Set(), projeto: new Set(), disciplina: new Set() });
  const [selecao, setSelecao] = useState(new Set());
  const [rascunho, setRascunho] = useState({});
  const [valorMassa, setValorMassa] = useState("");
  const [pagina, setPagina] = useState(0);
  const [msg, setMsg] = useState(null); // { tipo: 'sucesso' | 'erro', texto: '' }
  const [showConfirm, setShowConfirm] = useState(false);
  const [ordenacao, setOrdenacao] = useState({ col: "nome", asc: true });

  const limitePorPagina = 50;

  // 2. Monta os perfis dos colaboradores cruzando com seus apontamentos para uso nos filtros
  const perfis = useMemo(() => {
    const map = RAW.colaboradores.map((nome, id) => ({
      id, nome,
      setores: new Set(), projetos: new Set(), disciplinas: new Set()
    }));
    
    // Varre todas as horas preenchendo os locais onde a pessoa trabalhou
    RAW.rows.forEach(r => {
      const p = map[r[1]];
      if (p) {
        if (r[2] !== -1) p.setores.add(r[2]);
        if (r[3] !== -1 && !PLACEHOLDER_PROJ_IDX.has(r[3])) p.projetos.add(r[3]);
        if (r[4] !== -1) p.disciplinas.add(r[4]);
      }
    });

    return map.map(p => ({
      ...p,
      setorStr: Array.from(p.setores).map(i => RAW.setores[i]).join(", ") || "—",
      projetoStr: Array.from(p.projetos).map(i => RAW.projetos[i]).join(", ") || "—",
      discStr: Array.from(p.disciplinas).map(i => RAW.disciplinas[i]).join(", ") || "—",
      custoAtual: custoMap[p.nome] || 0
    }));
  }, [custoMap]);

  // 3. Aplica os filtros combinados e ordenação
  const filtrados = useMemo(() => {
    return perfis.filter(p => {
      // Filtro de Nome
      if (q && !p.nome.toUpperCase().includes(q.toUpperCase())) return false;
      // Filtros combinados
      if (filtros.setor.size && !Array.from(filtros.setor).some(s => p.setores.has(s))) return false;
      if (filtros.projeto.size && !Array.from(filtros.projeto).some(s => p.projetos.has(s))) return false;
      if (filtros.disciplina.size && !Array.from(filtros.disciplina).some(s => p.disciplinas.has(s))) return false;
      return true;
    }).sort((a, b) => {
      let vA = a[ordenacao.col], vB = b[ordenacao.col];
      
      // Ajuste para lidar com textos (ordem alfabética) e números
      if (typeof vA === 'string') vA = vA.toUpperCase();
      if (typeof vB === 'string') vB = vB.toUpperCase();

      if (vA < vB) return ordenacao.asc ? -1 : 1;
      if (vA > vB) return ordenacao.asc ? 1 : -1;
      return 0;
    });
  }, [perfis, q, filtros, ordenacao]);

  // Paginação básica baseada no array filtrado
  const paginados = filtrados.slice(pagina * limitePorPagina, (pagina + 1) * limitePorPagina);
  const totalPaginas = Math.ceil(filtrados.length / limitePorPagina);

  // Zera a página quando os filtros mudam
  useEffect(() => { setPagina(0); }, [q, filtros]);

  // Limpa mensagem automática
  useEffect(() => {
    if (msg) {
      const t = setTimeout(() => setMsg(null), 5000);
      return () => clearTimeout(t);
    }
  }, [msg]);

  // 4. Ações
  const limparFiltros = () => {
    setQ("");
    setFiltros({ setor: new Set(), projeto: new Set(), disciplina: new Set() });
  };

  const alternarSelecaoGeral = () => {
    if (selecao.size === filtrados.length && filtrados.length > 0) {
      setSelecao(new Set()); // Desmarca tudo
    } else {
      setSelecao(new Set(filtrados.map(f => f.nome))); // Marca todos do filtro atual
    }
  };

  const alternarLinha = (nome) => {
    const prox = new Set(selecao);
    if (prox.has(nome)) prox.delete(nome); else prox.add(nome);
    setSelecao(prox);
  };

  const aplicarEmMassa = () => {
    if (selecao.size === 0) {
      setMsg({ tipo: 'erro', texto: 'Selecione ao menos um colaborador.' });
      return;
    }
    const valM = parseFloat(String(valorMassa).replace(',', '.'));
    if (isNaN(valM) || valM < 0) {
      setMsg({ tipo: 'erro', texto: 'Informe um valor válido e positivo.' });
      return;
    }

    const proxRascunho = { ...rascunho };
    selecao.forEach(nome => {
      proxRascunho[nome] = valM;
    });
    setRascunho(proxRascunho);
    setValorMassa(""); // limpa o input
    setMsg({ tipo: 'sucesso', texto: `Valor R$ ${valM.toFixed(2)} programado para ${selecao.size} registro(s). Não esqueça de Salvar.` });
  };

  const alterarRascunhoIndividual = (nome, valor) => {
    let num = parseFloat(valor);
    if (isNaN(num) || num < 0) num = 0; // fallback simples visual 
    setRascunho(prev => ({ ...prev, [nome]: valor === "" ? "" : num }));
  };

  const salvarAlteracoes = () => {
    // Só envia os que são números válidos no rascunho
    const atualizacoes = {};
    let count = 0;
    
    Object.entries(rascunho).forEach(([nome, val]) => {
      let v = parseFloat(String(val).replace(',', '.'));
      if (!isNaN(v) && v >= 0) {
        atualizacoes[nome] = v;
        count++;
      }
    });

    if (count > 0) {
      updateCustoEmMassa(atualizacoes);
      setMsg({ tipo: 'sucesso', texto: `${count} registro(s) salvo(s) com sucesso nas configurações globais.` });
    }
    
    setRascunho({});
    setSelecao(new Set());
    setShowConfirm(false);
  };

  const cancelarAlteracoes = () => {
    setRascunho({});
    setSelecao(new Set());
    setShowConfirm(false);
  };

  const alternarOrdem = (col) => {
    setOrdenacao(prev => ({
      col,
      asc: prev.col === col ? !prev.asc : true
    }));
  };

  const thStyle = { textAlign: "left", padding: "10px", color: "#7c8ba1", fontSize: 11, textTransform: "uppercase", cursor: "pointer", userSelect: "none" };
  const tdStyle = { padding: "8px 10px", fontSize: 12, borderBottom: "1px solid #1c242e" };

  return (
    <div className="fade-in">
      <Section title="Gestão e Preenchimento em Massa de Custo/Hora">
        
        {/* Barra de Filtros */}
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center", marginBottom: 12, padding: 12, background: "#10151d", border: "1px solid #1c242e", borderRadius: 4 }}>
          <input placeholder="Filtrar por nome..." value={q} onChange={(e) => setQ(e.target.value)}
            style={{ background: "#141a22", border: "1px solid #2c3a4d", borderRadius: 3, color: "#dbe2ec", padding: "6px 10px", fontSize: 12, width: 220 }} />
          <MultiSelect label="Disciplina" options={opt(RAW.disciplinas)} selected={filtros.disciplina} onChange={(s) => setFiltros(f => ({ ...f, disciplina: s }))} />
          <MultiSelect label="Setor" options={opt(RAW.setores)} selected={filtros.setor} onChange={(s) => setFiltros(f => ({ ...f, setor: s }))} />
          <MultiSelect label="Projeto" options={opt(RAW.projetos)} selected={filtros.projeto} onChange={(s) => setFiltros(f => ({ ...f, projeto: s }))} />
          
          <button onClick={limparFiltros} style={btnGhost}>Limpar filtros</button>
          
          <span style={{ marginLeft: "auto", fontSize: 11.5, color: "#5c6b80" }}>
            Exibindo {filtrados.length} pessoa(s)
          </span>
        </div>

        {/* Barra de Ações em Massa e Salvar */}
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14, padding: "12px 14px", background: "#141a22", border: "1px solid #263241", borderRadius: 4 }}>
          
          {/* Lado Esquerdo - Ações de preenchimento */}
          <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
            <span style={{ fontSize: 12, color: "#9fb0c6", fontWeight: 600 }}>{selecao.size} Selecionado(s)</span>
            <div style={{ width: 1, height: 20, background: "#2c3a4d" }}></div>
            <input type="number" min="0" step="0.01" placeholder="R$ Valor único..." value={valorMassa} onChange={(e) => setValorMassa(e.target.value)}
              style={{ background: "#0c1016", border: "1px solid #2c3a4d", borderRadius: 3, color: "#dbe2ec", padding: "6px 8px", fontSize: 12, width: 130 }} />
            <button onClick={aplicarEmMassa} style={btnPrimary}>Aplicar aos selecionados</button>
          </div>

          {/* Lado Direito - Mensagens e Botões de Salvar */}
          <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
            {msg && (
              <span style={{ fontSize: 11.5, color: msg.tipo === 'sucesso' ? '#5C8A5C' : '#e08787', marginRight: 10, fontWeight: 500 }} className="fade-in">
                {msg.texto}
              </span>
            )}
            
            {Object.keys(rascunho).length > 0 && (
              <>
                <button onClick={cancelarAlteracoes} style={btnGhost}>Cancelar</button>
                <button onClick={() => setShowConfirm(true)} style={btnSuccess}>
                  Salvar Alterações ({Object.keys(rascunho).length})
                </button>
              </>
            )}
          </div>
        </div>

        {/* Tabela Interativa */}
        <div style={{ border: "1px solid #263241", borderRadius: 4, overflowX: "auto" }}>
          <table style={{ width: "100%", borderCollapse: "collapse" }}>
            <thead>
              <tr style={{ background: "#10151d", borderBottom: "2px solid #263241" }}>
                <th style={{ padding: "10px", width: 40, textAlign: "center" }}>
                  <input type="checkbox" onChange={alternarSelecaoGeral} 
                    checked={selecao.size > 0 && selecao.size === filtrados.length} 
                    ref={input => { if (input) input.indeterminate = selecao.size > 0 && selecao.size < filtrados.length; }} />
                </th>
                <th style={thStyle} onClick={() => alternarOrdem('nome')}>Colaborador {ordenacao.col === 'nome' && (ordenacao.asc ? '▲' : '▼')}</th>
                <th style={thStyle} onClick={() => alternarOrdem('discStr')}>Disciplina {ordenacao.col === 'discStr' && (ordenacao.asc ? '▲' : '▼')}</th>
                <th style={thStyle} onClick={() => alternarOrdem('setorStr')}>Setor {ordenacao.col === 'setorStr' && (ordenacao.asc ? '▲' : '▼')}</th>
                <th style={thStyle} onClick={() => alternarOrdem('projetoStr')}>Projeto {ordenacao.col === 'projetoStr' && (ordenacao.asc ? '▲' : '▼')}</th>
                <th style={{...thStyle, textAlign: "right"}} onClick={() => alternarOrdem('custoAtual')}>Custo Atual (R$) {ordenacao.col === 'custoAtual' && (ordenacao.asc ? '▲' : '▼')}</th>
                <th style={{...thStyle, textAlign: "right", width: 140 }}>Novo Custo / Hora</th>
              </tr>
            </thead>
            <tbody>
              {paginados.length === 0 ? (
                <tr><td colSpan="7" style={{ textAlign: "center", padding: 30, color: "#5c6b80", fontSize: 13 }}>Nenhum colaborador encontrado com estes filtros.</td></tr>
              ) : (
                paginados.map(p => {
                  const rascunhoAtivo = rascunho[p.nome] !== undefined;
                  const rowBg = rascunhoAtivo ? "#19283b" : "transparent"; // Destaque para linha editada
                  
                  return (
                    <tr key={p.nome} style={{ background: rowBg, transition: "background 0.2s" }}>
                      <td style={{ ...tdStyle, textAlign: "center" }}>
                        <input type="checkbox" checked={selecao.has(p.nome)} onChange={() => alternarLinha(p.nome)} />
                      </td>
                      <td style={{ ...tdStyle, fontWeight: 500 }}>{p.nome}</td>
                      
                      {/* Textos com reticências para não quebrar a tabela se o cara estiver em 20 obras */}
                      <td style={{ ...tdStyle, maxWidth: 150, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }} title={p.discStr}>{p.discStr}</td>
                      <td style={{ ...tdStyle, maxWidth: 150, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }} title={p.setorStr}>{p.setorStr}</td>
                      <td style={{ ...tdStyle, maxWidth: 150, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }} title={p.projetoStr}>{p.projetoStr}</td>
                      
                      <td style={{ ...tdStyle, textAlign: "right", color: "#9fb0c6", fontFamily: "monospace" }}>
                        {p.custoAtual ? p.custoAtual.toFixed(2) : "0.00"}
                      </td>
                      <td style={{ ...tdStyle, textAlign: "right" }}>
                        <input type="number" min="0" step="0.01" placeholder="0.00"
                          value={rascunhoAtivo ? rascunho[p.nome] : (p.custoAtual || "")}
                          onChange={(e) => alterarRascunhoIndividual(p.nome, e.target.value)}
                          style={{ 
                            background: rascunhoAtivo ? "#0c1016" : "#141a22", 
                            border: rascunhoAtivo ? "1px solid #3E7CB1" : "1px solid #2c3a4d", 
                            borderRadius: 3, color: rascunhoAtivo ? "#eef2f8" : "#dbe2ec", 
                            padding: "6px 8px", width: 100, textAlign: "right", fontFamily: "monospace" 
                          }} />
                      </td>
                    </tr>
                  );
                })
              )}
            </tbody>
          </table>
        </div>

        {/* Paginação */}
        {totalPaginas > 1 && (
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 14 }}>
            <span style={{ fontSize: 11.5, color: "#5c6b80" }}>Página {pagina + 1} de {totalPaginas}</span>
            <div style={{ display: "flex", gap: 6 }}>
              <button onClick={() => setPagina(p => Math.max(0, p - 1))} disabled={pagina === 0} style={btnGhost}>&lt; Anterior</button>
              <button onClick={() => setPagina(p => Math.min(totalPaginas - 1, p + 1))} disabled={pagina >= totalPaginas - 1} style={btnGhost}>Próxima &gt;</button>
            </div>
          </div>
        )}

        {/* Modal de Confirmação */}
        {showConfirm && (
          <div style={{ position: "fixed", top: 0, left: 0, right: 0, bottom: 0, background: "rgba(0,0,0,0.6)", zIndex: 999, display: "flex", alignItems: "center", justifyContent: "center" }}>
            <div className="fade-in" style={{ background: "#10151d", border: "1px solid #263241", borderRadius: 6, padding: 24, width: 400, boxShadow: "0 10px 40px rgba(0,0,0,0.8)" }}>
              <h3 style={{ margin: "0 0 10px", fontSize: 16, color: "#eef2f8" }}>Salvar Alterações em Massa?</h3>
              <p style={{ fontSize: 13, color: "#9fb0c6", lineHeight: 1.5, marginBottom: 20 }}>
                Você está prestes a atualizar o custo/hora de <b>{Object.keys(rascunho).length} colaborador(es)</b>. Esta alteração refletirá em todos os relatórios e indicadores de custo financeiros.
              </p>
              <div style={{ display: "flex", justifyContent: "flex-end", gap: 10 }}>
                <button onClick={() => setShowConfirm(false)} style={btnGhost}>Cancelar</button>
                <button onClick={salvarAlteracoes} style={btnSuccess}>Confirmar e Salvar</button>
              </div>
            </div>
          </div>
        )}

      </Section>
    </div>
  );
}

// ---------------- Fim ----------------
// Adicionei os componentes restantes da aplicação aqui (que você forneceu no código original) para que a aplicação rode perfeitamente.

createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
