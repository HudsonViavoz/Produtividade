const EXCLUDED_PROJECT_LABELS = new Set([
  "FERIAS", "FÉRIAS", "ATESTADO", "FERIADO", "FALTA",
  "SERVICO INTERNO", "SERVIÇO INTERNO", "REUNIAO DE EQUIPE",
  "REUNIAO GERAL", "SERVICOS EXTERNOS",
]);
let PLACEHOLDER_PROJ_IDX = new Set();
function recomputePlaceholderProjIdx() {
  PLACEHOLDER_PROJ_IDX = new Set(
    RAW.projetos
      .map((p, i) => [(p || "").trim().toUpperCase(), i])
      .filter(([p]) => EXCLUDED_PROJECT_LABELS.has(p))

}

// ---------- Conexão com o Supabase (banco da MATRIZ) ----------
const SUPABASE_URL = "https://tvvxiypewbephjvonwds.supabase.co";
const SUPABASE_KEY = "sb_publishable_t5s5ev6j_npbkE9DokHPAA_5ILdCtiy";
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

// Busca todos os registros de horas do banco e monta a mesma estrutura RAW
// que o painel usava antes (colaboradores/setores/projetos/disciplinas/tarefas + rows indexados).
async function carregarDadosSupabase() {
  let todos = [];
  let from = 0;
  const pageSize = 1000;
  // pagina em blocos de 1000 (limite padrão de linhas por consulta no Supabase)
  while (true) {
    const { data, error } = await sb
      .from("registros")
      .select("colaborador,obra,data,horas,setor,disciplina,tarefa")
      .range(from, from + pageSize - 1);
    if (error) throw error;
    if (!data || data.length === 0) break;
    todos = todos.concat(data);
    if (data.length < pageSize) break;
    from += pageSize;
  }

  const uniqueSorted = (arr) =>
    Array.from(new Set(arr.filter((v) => v !== null && v !== undefined && v !== "")))
      .sort((a, b) => String(a).localeCompare(String(b), "pt-BR"));

  const colaboradores = uniqueSorted(todos.map((r) => r.colaborador));
  const setores = uniqueSorted(todos.map((r) => r.setor));
  const projetos = uniqueSorted(todos.map((r) => r.obra));
  const disciplinas = uniqueSorted(todos.map((r) => r.disciplina));
  const tarefas = uniqueSorted(todos.map((r) => r.tarefa));

  const idxOf = (arr) => {
    const m = new Map();
    arr.forEach((v, i) => m.set(v, i));
    return m;
  };
  const colabIdx = idxOf(colaboradores);
  const setorIdx = idxOf(setores);
  const projIdx = idxOf(projetos);
  const discIdx = idxOf(disciplinas);
  const tarefaIdx = idxOf(tarefas);

  const rows = todos.map((r) => {
    const dateInt = r.data ? parseInt(String(r.data).replace(/-/g, ""), 10) : 0;
    const horas = Number(r.horas) || 0;
    return [
      dateInt,
      r.colaborador ? (colabIdx.has(r.colaborador) ? colabIdx.get(r.colaborador) : -1) : -1,
      r.setor ? (setorIdx.has(r.setor) ? setorIdx.get(r.setor) : -1) : -1,
      r.obra ? (projIdx.has(r.obra) ? projIdx.get(r.obra) : -1) : -1,
      r.disciplina ? (discIdx.has(r.disciplina) ? discIdx.get(r.disciplina) : -1) : -1,
      r.tarefa ? (tarefaIdx.has(r.tarefa) ? tarefaIdx.get(r.tarefa) : -1) : -1,
      horas,
    ];
  });

  RAW = { colaboradores, setores, projetos, disciplinas, tarefas, rows };
  recomputePlaceholderProjIdx();
}

const MONTH_ABBR = ["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"];
const monthKey = (dateint) => Math.floor(dateint / 100);
const monthLabel = (ym) => `${MONTH_ABBR[(ym % 100) - 1]}/${String(ym / 100 | 0).slice(-2)}`;
const dateFromInt = (di) => {
  const y = Math.floor(di / 10000), m = Math.floor((di % 10000) / 100), d = di % 100;
  return `${String(d).padStart(2, "0")}/${String(m).padStart(2, "0")}/${y}`;
};

const fmtH = (h) => (h || 0).toLocaleString("pt-BR", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const fmtBRL = (v) => (v || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL", maximumFractionDigits: 0 });
const fmtPct = (v) => (isFinite(v) ? (v * 100).toLocaleString("pt-BR", { maximumFractionDigits: 1 }) : "0") + "%";

const PALETTE = ["#2E5C8A", "#C97A2B", "#5C8A5C", "#A13D3D", "#7A6A8A", "#4A7A6A", "#B0562F", "#3E7CB1", "#8B6F47", "#767676", "#5B7DB1", "#8B3A3A"];

// Normaliza texto para comparação (maiúsculas/minúsculas, acentuação e espaços não importam).
function normalizarTexto(s) {
  return (s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim().toUpperCase().replace(/\s+/g, " ");
}

// A disciplina "OUTRA" identifica lançamentos que não estão associados a um projeto específico
// (Atestado, Férias, Feriado, Falta, Reunião de Equipe etc.). Eles continuam contando para o
// custo do funcionário, mas são analisados à parte, na aba "Outros Registros".
const DISCIPLINA_OUTRA = "OUTRA";
function isDisciplinaOutra(r) {
  return normalizarTexto(RAW.disciplinas[r[4]]) === DISCIPLINA_OUTRA;
}

// Nomes conhecidos dentro da disciplina "OUTRA" (comparação tolerante a maiúsculas/acentos/espaços).
// Qualquer outro projeto associado a "OUTRA" que não esteja nesta lista é mantido com o nome original.
const OUTROS_PROJETOS_LABEL = {
  "ATESTADO": "Atestado",
  "FERIAS": "Férias",
  "FERIADO": "Feriado",
  "FALTA": "Falta",
  "REUNIAO DE EQUIPE": "Reunião de Equipe",
};
function categoriaOutra(r) {
  const nomeOriginal = (RAW.projetos[r[3]] || "").trim() || "(sem projeto)";
  return OUTROS_PROJETOS_LABEL[normalizarTexto(nomeOriginal)] || nomeOriginal;
}

function rowCusto(r, custoMap) {
  const custoHora = custoMap[RAW.colaboradores[r[1]]] || 0;
  return r[6] * custoHora;
}

// ---------- generic aggregation ----------
function aggregateBy(rows, keyFn, custoMap) {
  const map = new Map();
  for (const r of rows) {
    const key = keyFn(r);
    if (key === null || key === undefined) continue;
    if (!map.has(key)) {
      map.set(key, { horas: 0, custo: 0, colabs: new Set(), dias: new Set(), projetos: new Set(), n: 0 });
    }
    const g = map.get(key);
    g.horas += r[6];
    g.n += 1;
    g.custo += rowCusto(r, custoMap);
    g.colabs.add(r[1]);
    g.dias.add(r[0]);
    g.projetos.add(r[3]);
  }
  return map;
}

function mapToArr(map, nameOf) {
  return Array.from(map.entries()).map(([key, g]) => ({
    key, nome: nameOf(key), horas: g.horas, custo: g.custo,
    nColabs: g.colabs.size, nDias: g.dias.size, nProjetos: g.projetos.size, n: g.n,
    mediaHorasDia: g.dias.size ? g.horas / g.dias.size : 0,
    custoMedioProjeto: g.projetos.size ? g.custo / g.projetos.size : 0,
    custoMedioFuncionario: g.colabs.size ? g.custo / g.colabs.size : 0,
    projetosPorFuncionario: g.colabs.size ? g.projetos.size / g.colabs.size : 0,
  }));
}

// ---------- small UI atoms ----------
function KpiCard({ label, value, sub, accent }) {

function DataTable({ columns, rows, maxRows = 25 }) {
  const shown = rows.slice(0, maxRows);
  return (
    <div style={{ overflowX: "auto", border: "1px solid #263241", borderRadius: 3 }}>
      <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 12.5 }}>
        <thead>
          <tr style={{ background: "#141a22" }}>
            {columns.map((c) => (
              <th key={c.key} style={{
                textAlign: c.align || "left", padding: "8px 10px", color: "#7c8ba1",
                fontWeight: 600, fontSize: 10.5, letterSpacing: 0.4, textTransform: "uppercase",
                borderBottom: "1px solid #263241", whiteSpace: "nowrap",
              }}>{c.label}</th>
            ))}
          </tr>
        </thead>
        <tbody>
          {shown.map((row, i) => (
            <tr key={i} style={{ borderBottom: "1px solid #1c242e" }}>
              {columns.map((c) => (
                <td key={c.key} style={{
                  padding: "7px 10px", color: c.mono ? "#c3cee0" : "#dbe2ec",
                  fontFamily: c.mono ? "'JetBrains Mono', Consolas, monospace" : "inherit",
                  textAlign: c.align || "left", whiteSpace: "nowrap",
                }}>{c.render ? c.render(row) : row[c.key]}</td>
              ))}
            </tr>
          ))}
        </tbody>
      </table>
      {rows.length > maxRows && (
        <div style={{ padding: "6px 10px", fontSize: 11, color: "#5c6b80" }}>
          mostrando {maxRows} de {rows.length}
        </div>
      )}
    </div>
  );
}

function MultiSelect({ label, options, selected, onChange }) {
  const [open, setOpen] = useState(false);
  const [q, setQ] = useState("");
  const filtered = q ? options.filter((o) => o.label.toUpperCase().includes(q.toUpperCase())) : options;
  const toggle = (idx) => {
    const next = new Set(selected);
    if (next.has(idx)) next.delete(idx); else next.add(idx);
    onChange(next);
  };
  return (
    <div style={{ position: "relative" }}>
      <button onClick={() => setOpen((v) => !v)} style={{
        background: selected.size ? "#1d2c3f" : "#141a22", border: "1px solid #2c3a4d", color: "#dbe2ec",
        borderRadius: 3, padding: "7px 10px", fontSize: 12, cursor: "pointer", minWidth: 130, textAlign: "left",
      }}>
        {label}{selected.size ? ` (${selected.size})` : ""} ▾
      </button>
      {open && (
        <div style={{
          position: "absolute", top: "110%", left: 0, zIndex: 20, background: "#141a22",
          border: "1px solid #2c3a4d", borderRadius: 4, width: 260, maxHeight: 320, display: "flex",
          flexDirection: "column", boxShadow: "0 8px 24px rgba(0,0,0,.4)",
        }}>
          <div style={{ padding: 8, borderBottom: "1px solid #263241" }}>
            <input value={q} onChange={(e) => setQ(e.target.value)} placeholder="buscar..."
              style={{ width: "100%", background: "#0c1016", border: "1px solid #263241", borderRadius: 3, color: "#dbe2ec", padding: "5px 7px", fontSize: 12 }} />
          </div>
          <div style={{ overflowY: "auto", padding: 4 }}>
            {filtered.slice(0, 400).map((o) => (
              <label key={o.value} style={{ display: "flex", gap: 7, alignItems: "center", padding: "4px 6px", fontSize: 12.5, color: "#dbe2ec", cursor: "pointer" }}>
                <input type="checkbox" checked={selected.has(o.value)} onChange={() => toggle(o.value)} />
                <span style={{ overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{o.label}</span>
              </label>
            ))}
            {filtered.length === 0 && <div style={{ padding: 8, fontSize: 12, color: "#5c6b80" }}>nenhum resultado</div>}
          </div>
          <div style={{ display: "flex", justifyContent: "space-between", padding: 8, borderTop: "1px solid #263241" }}>
            <button onClick={() => onChange(new Set())} style={btnGhost}>limpar</button>
            <button onClick={() => setOpen(false)} style={btnPrimary}>fechar</button>
          </div>
        </div>
      )}
    </div>
  );
}

const btnGhost = { background: "transparent", border: "1px solid #2c3a4d", color: "#9fb0c6", borderRadius: 3, padding: "5px 10px", fontSize: 11.5, cursor: "pointer" };
const btnPrimary = { background: "#2E5C8A", border: "1px solid #3E7CB1", color: "#eaf1fb", borderRadius: 3, padding: "5px 10px", fontSize: 11.5, cursor: "pointer" };

const NAV = [
  ["dashboard", "Dashboard"], ["projetos", "Projetos"], ["funcionarios", "Funcionários"],
  ["outros", "Outros Registros"], ["custos", "Custos"], ["mensal", "Mensal"],
  ["setores", "Setores"], ["disciplinas", "Disciplinas"], ["tarefas", "Tarefas"],
  ["alertas", "Alertas"], ["custohora", "Custo/Hora"], ["revisao", "Revisão"],
];

export default function App() {
  const [view, setView] = useState("dashboard");
  const [filters, setFilters] = useState({
    dateFrom: "", dateTo: "", colab: new Set(), setor: new Set(), projeto: new Set(),
    disciplina: new Set(), tarefaSearch: "",
  });
  const [custoMap, setCustoMap] = useState({});
  const [custoLoaded, setCustoLoaded] = useState(false);
  const [thresholds, setThresholds] = useState({ outraPct: 20, hhMultiplicador: 2, horasDiaMax: 10 });

  // ---------- Login + carregamento dos dados do Supabase ----------
  const [session, setSession] = useState(null);
  const [authChecking, setAuthChecking] = useState(true);
  const [dataLoading, setDataLoading] = useState(false);
  const [dataError, setDataError] = useState(null);
  const [dataVersion, setDataVersion] = useState(0);
  const [ultimaAtualizacao, setUltimaAtualizacao] = useState(null);
  const [atualizandoManual, setAtualizandoManual] = useState(false);
  const [erroAtualizar, setErroAtualizar] = useState("");
  const [loginEmail, setLoginEmail] = useState("");
  const [loginSenha, setLoginSenha] = useState("");
  const [loginErro, setLoginErro] = useState("");
  const [loginCarregando, setLoginCarregando] = useState(false);

  useEffect(() => {
    let mounted = true;
    sb.auth.getSession().then(({ data }) => {
      if (!mounted) return;
      setSession(data.session);
      setAuthChecking(false);
    });
    const { data: listener } = sb.auth.onAuthStateChange((_event, newSession) => {
      setSession(newSession);
    });
    return () => { mounted = false; listener.subscription.unsubscribe(); };
  }, []);

  useEffect(() => {
    if (!session) return;
    let mounted = true;
    (async () => {
      setDataLoading(true);
      setDataError(null);
      try {
        await carregarDadosSupabase();
        if (mounted) {
          setDataVersion((v) => v + 1);
          setUltimaAtualizacao(new Date());
        }
      } catch (e) {
        if (mounted) setDataError((e && e.message) || "Erro ao carregar os dados do banco.");
      }
      if (mounted) setDataLoading(false);
    })();
    return () => { mounted = false; };
  }, [session]);

  // Botão "Atualizar dados": busca de novo no Supabase sem precisar recarregar a página inteira.
  async function atualizarDadosManual() {
    setAtualizandoManual(true);
    setErroAtualizar("");
    try {
      await carregarDadosSupabase();
      setDataVersion((v) => v + 1);
      setUltimaAtualizacao(new Date());
    } catch (e) {
      setErroAtualizar((e && e.message) || "Erro ao atualizar os dados.");
    }
    setAtualizandoManual(false);
  }

  const fmtUltimaAtualizacao = (d) => {
    if (!d) return "";
    const pad = (n) => String(n).padStart(2, "0");
    return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()} às ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  };

  async function handleLogin(e) {
    e.preventDefault();
    setLoginErro("");
    setLoginCarregando(true);
    const { error } = await sb.auth.signInWithPassword({ email: loginEmail, password: loginSenha });
    setLoginCarregando(false);
    if (error) setLoginErro(error.message === "Invalid login credentials" ? "E-mail ou senha inválidos." : error.message);
  }

  const pageWrapStyle = { fontFamily: "'Inter', 'Helvetica Neue', Arial, sans-serif", background: "#0c1016", color: "#dbe2ec", minHeight: "100vh", padding: 16, display: "flex", alignItems: "center", justifyContent: "center" };

  useEffect(() => {
    // Nesta versão publicada fora do Claude, usamos localStorage (guardado só neste navegador)
    // em vez do window.storage do Claude, que só existe dentro do ambiente de artifacts.
    try {
      const raw = localStorage.getItem("custo_hora_colaboradores");
      if (raw) setCustoMap(JSON.parse(raw));
    } catch (e) { /* sem dado salvo ainda */ }
    setCustoLoaded(true);
  }, []);

  const updateCusto = useCallback((nome, valor) => {
    setCustoMap((prev) => {
      const next = { ...prev, [nome]: valor };
      try { localStorage.setItem("custo_hora_colaboradores", JSON.stringify(next)); } catch (e) {}
      return next;
    });
  }, []);

  const updateCustos = useCallback((alteracoes) => {
    setCustoMap((prev) => {
      const next = { ...prev };
      Object.entries(alteracoes).forEach(([nome, valor]) => { next[nome] = valor; });
      try { localStorage.setItem("custo_hora_colaboradores", JSON.stringify(next)); } catch (e) {}
      return next;
    });
  }, []);

  const hasCusto = Object.keys(custoMap).length > 0;

  const dateFromInt2 = (s) => s ? parseInt(s.replace(/-/g, ""), 10) : null;

  const filteredRows = useMemo(() => {
    const df = dateFromInt2(filters.dateFrom);
    const dt = dateFromInt2(filters.dateTo);
    const tSearch = filters.tarefaSearch.trim().toUpperCase();
    return RAW.rows.filter((r) => {
      if (df && r[0] < df) return false;
      if (dt && r[0] > dt) return false;
      if (filters.colab.size && !filters.colab.has(r[1])) return false;
      if (filters.setor.size && !filters.setor.has(r[2])) return false;
      if (filters.projeto.size && !filters.projeto.has(r[3])) return false;
      if (filters.disciplina.size && !filters.disciplina.has(r[4])) return false;
      if (tSearch && (r[5] === -1 || !RAW.tarefas[r[5]].toUpperCase().includes(tSearch))) return false;
      return true;
    });
  }, [filters, dataVersion]);

  const kpis = useMemo(() => {
    let horas = 0, custo = 0;
    const colabs = new Set(), setores = new Set(), projetos = new Set(), discs = new Set();
    for (const r of filteredRows) {
      horas += r[6];
      custo += rowCusto(r, custoMap);
      colabs.add(r[1]); setores.add(r[2]); discs.add(r[4]);
      if (!PLACEHOLDER_PROJ_IDX.has(r[3])) projetos.add(r[3]);
    }
    return { horas, custo, colabs: colabs.size, setores: setores.size, projetos: projetos.size, discs: discs.size };
  }, [filteredRows, custoMap, dataVersion]);

  const opt = (arr, excludeSet) => arr.map((v, i) => [v, i]).filter(([, i]) => !excludeSet || !excludeSet.has(i)).map(([v, i]) => ({ label: v, value: i }));

  // ---------- Telas de login / carregamento (depois de todos os hooks, como o React exige) ----------
  if (authChecking) {
    return <div style={pageWrapStyle}>Verificando login...</div>;
  }

  if (!session) {
    return (
      <div style={pageWrapStyle}>
        <form onSubmit={handleLogin} style={{ background: "#10151d", border: "1px solid #1c242e", borderRadius: 6, padding: 24, width: 320 }}>
          <h2 style={{ margin: "0 0 4px", fontSize: 16, color: "#eef2f8" }}>Painel de Produtividade</h2>
          <div style={{ fontSize: 12, color: "#5c6b80", marginBottom: 16 }}>Entre com sua conta do sistema de registro de horas (matriz).</div>
          <label style={{ display: "block", fontSize: 11.5, color: "#9fb0c6", marginBottom: 4 }}>E-MAIL</label>
          <input type="email" required value={loginEmail} onChange={(e) => setLoginEmail(e.target.value)}
            style={{ width: "100%", background: "#141a22", border: "1px solid #2c3a4d", borderRadius: 3, color: "#dbe2ec", padding: "8px 10px", fontSize: 13, marginBottom: 12, boxSizing: "border-box" }} />
          <label style={{ display: "block", fontSize: 11.5, color: "#9fb0c6", marginBottom: 4 }}>SENHA</label>
          <input type="password" required value={loginSenha} onChange={(e) => setLoginSenha(e.target.value)}
            style={{ width: "100%", background: "#141a22", border: "1px solid #2c3a4d", borderRadius: 3, color: "#dbe2ec", padding: "8px 10px", fontSize: 13, marginBottom: 16, boxSizing: "border-box" }} />
          <button type="submit" disabled={loginCarregando} style={{ width: "100%", background: "#2E5C8A", color: "#eaf1fb", border: "1px solid #3E7CB1", borderRadius: 3, padding: "9px 0", fontSize: 13, fontWeight: 600, cursor: "pointer" }}>
            {loginCarregando ? "Entrando..." : "Entrar"}
          </button>
          {loginErro && <div style={{ marginTop: 12, fontSize: 12, color: "#e08787" }}>{loginErro}</div>}
        </form>
      </div>
    );
  }

  if (dataLoading && dataVersion === 0) {
    return <div style={pageWrapStyle}>Carregando registros de horas do banco...</div>;
  }

  if (dataError) {
    return (
      <div style={pageWrapStyle}>
        <div style={{ maxWidth: 420, textAlign: "center" }}>
          <div style={{ fontSize: 14, color: "#e08787", marginBottom: 10 }}>Não foi possível carregar os dados.</div>
          <div style={{ fontSize: 12, color: "#9fb0c6" }}>{dataError}</div>
        </div>
      </div>
    );
  }

  return (
    <div style={{ fontFamily: "'Inter', 'Helvetica Neue', Arial, sans-serif", background: "#0c1016", color: "#dbe2ec", minHeight: "100%", padding: 16 }}>
      <div style={{ display: "flex", alignItems: "baseline", gap: 10, marginBottom: 4, flexWrap: "wrap" }}>
        <h1 style={{ margin: 0, fontSize: 18, fontWeight: 700, color: "#eef2f8", letterSpacing: 0.2 }}>Painel de Produtividade e Custos</h1>
        <span style={{ fontSize: 11.5, color: "#5c6b80" }}>{RAW.rows.length.toLocaleString("pt-BR")} apontamentos · {RAW.colaboradores.length} colaboradores · {RAW.setores.length} setores</span>
        <span style={{ marginLeft: "auto", display: "flex", alignItems: "center", gap: 8 }}>
          <span style={{ fontSize: 11, color: "#5c6b80" }}>
            {ultimaAtualizacao ? `Última atualização: ${fmtUltimaAtualizacao(ultimaAtualizacao)}` : ""}
          </span>
          <button onClick={atualizarDadosManual} disabled={atualizandoManual} style={{
            background: "#141a22", color: "#dbe2ec", border: "1px solid #2c3a4d", borderRadius: 3,
            padding: "6px 11px", fontSize: 12, cursor: atualizandoManual ? "default" : "pointer",
            opacity: atualizandoManual ? 0.6 : 1,
          }}>
            {atualizandoManual ? "Atualizando..." : "⟳ Atualizar dados"}
          </button>
        </span>
      </div>
      {erroAtualizar && (
        <div style={{ fontSize: 11.5, color: "#e08787", marginBottom: 6 }}>{erroAtualizar}</div>
      )}
      <div style={{ fontSize: 11.5, color: "#5c6b80", marginBottom: 14 }}>
        {!hasCusto && "Cadastre o custo/hora em \"Custo/Hora\" para habilitar os indicadores financeiros. "}
        Base: exportação de apontamento de horas por setor.
      </div>

      {/* nav */}
      <div style={{ display: "flex", gap: 4, flexWrap: "wrap", marginBottom: 14, borderBottom: "1px solid #1c242e", paddingBottom: 10 }}>
        {NAV.map(([k, label]) => (
          <button key={k} onClick={() => setView(k)} style={{
            background: view === k ? "#2E5C8A" : "transparent", color: view === k ? "#eaf1fb" : "#9fb0c6",
            border: view === k ? "1px solid #3E7CB1" : "1px solid transparent", borderRadius: 3,
            padding: "6px 11px", fontSize: 12.5, cursor: "pointer", fontWeight: view === k ? 600 : 400,
          }}>{label}</button>
        ))}
      </div>

      {/* filters */}
      <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center", marginBottom: 18, padding: 10, background: "#10151d", border: "1px solid #1c242e", borderRadius: 4 }}>
        <input type="date" value={filters.dateFrom} onChange={(e) => setFilters((f) => ({ ...f, dateFrom: e.target.value }))}
          style={{ background: "#141a22", border: "1px solid #2c3a4d", borderRadius: 3, color: "#dbe2ec", padding: "6px 8px", fontSize: 12 }} />
        <span style={{ color: "#5c6b80", fontSize: 12 }}>até</span>
        <input type="date" value={filters.dateTo} onChange={(e) => setFilters((f) => ({ ...f, dateTo: e.target.value }))}
          style={{ background: "#141a22", border: "1px solid #2c3a4d", borderRadius: 3, color: "#dbe2ec", padding: "6px 8px", fontSize: 12 }} />
        <MultiSelect label="Colaborador" options={opt(RAW.colaboradores)} selected={filters.colab} onChange={(s) => setFilters((f) => ({ ...f, colab: s }))} />
        <MultiSelect label="Setor" options={opt(RAW.setores)} selected={filters.setor} onChange={(s) => setFilters((f) => ({ ...f, setor: s }))} />
        <MultiSelect label="Projeto" options={opt(RAW.projetos)} selected={filters.projeto} onChange={(s) => setFilters((f) => ({ ...f, projeto: s }))} />
        <MultiSelect label="Disciplina" options={opt(RAW.disciplinas)} selected={filters.disciplina} onChange={(s) => setFilters((f) => ({ ...f, disciplina: s }))} />
        <input placeholder="buscar tarefa..." value={filters.tarefaSearch} onChange={(e) => setFilters((f) => ({ ...f, tarefaSearch: e.target.value }))}
          style={{ background: "#141a22", border: "1px solid #2c3a4d", borderRadius: 3, color: "#dbe2ec", padding: "6px 8px", fontSize: 12, width: 150 }} />
        <button onClick={() => setFilters({ dateFrom: "", dateTo: "", colab: new Set(), setor: new Set(), projeto: new Set(), disciplina: new Set(), tarefaSearch: "" })}
          style={btnGhost}>limpar filtros</button>
        <span style={{ marginLeft: "auto", fontSize: 11.5, color: "#5c6b80" }}>{filteredRows.length.toLocaleString("pt-BR")} registros no filtro</span>
      </div>

      {view === "dashboard" && <DashboardView filteredRows={filteredRows} kpis={kpis} custoMap={custoMap} hasCusto={hasCusto} />}
      {view === "projetos" && <ProjetosView filteredRows={filteredRows} custoMap={custoMap} hasCusto={hasCusto} />}
      {view === "funcionarios" && <FuncionariosView filteredRows={filteredRows} custoMap={custoMap} hasCusto={hasCusto} />}
      {view === "outros" && <OutrosRegistrosView filteredRows={filteredRows} custoMap={custoMap} hasCusto={hasCusto} />}
      {view === "custos" && <CustosView filteredRows={filteredRows} custoMap={custoMap} hasCusto={hasCusto} />}
      {view === "mensal" && <MensalView filteredRows={filteredRows} custoMap={custoMap} hasCusto={hasCusto} />}
      {view === "setores" && <SetoresView filteredRows={filteredRows} custoMap={custoMap} hasCusto={hasCusto} />}
      {view === "disciplinas" && <DisciplinasView filteredRows={filteredRows} custoMap={custoMap} hasCusto={hasCusto} />}
      {view === "tarefas" && <TarefasView filteredRows={filteredRows} custoMap={custoMap} hasCusto={hasCusto} />}
      {view === "alertas" && <AlertasView filteredRows={filteredRows} custoMap={custoMap} hasCusto={hasCusto} thresholds={thresholds} setThresholds={setThresholds} />}
      {view === "custohora" && <CustoHoraView custoMap={custoMap} updateCusto={updateCusto} updateCustos={updateCustos} loaded={custoLoaded} />}
      {view === "revisao" && <RevisaoView />}

      <div style={{ marginTop: 26, paddingTop: 14, borderTop: "1px solid #1c242e", fontSize: 11, color: "#4a5668", lineHeight: 1.6 }}>
        Campos recomendados para ampliar a análise: horas previstas e custo previsto por projeto,
        código e cliente do projeto, status e datas de início/término previstas, cargo/função do colaborador.
      </div>
    </div>
  );
}

function ChartBox({ title, height = 260, children }) {
  return (
    <div style={{ border: "1px solid #263241", borderRadius: 3, padding: 12, background: "#10151d", flex: "1 1 380px", minWidth: 320 }}>
      <div style={{ fontSize: 11.5, color: "#9fb0c6", marginBottom: 8, fontWeight: 600 }}>{title}</div>
      <ResponsiveContainer width="100%" height={height}>{children}</ResponsiveContainer>

  );
}

const axisStyle = { fontSize: 10.5, fill: "#7c8ba1" };
const tooltipStyle = { background: "#141a22", border: "1px solid #2c3a4d", fontSize: 12, borderRadius: 3 };

function DashboardView({ filteredRows, kpis, custoMap, hasCusto }) {
  const porProjeto = useMemo(() => {
    const map = aggregateBy(filteredRows.filter((r) => !PLACEHOLDER_PROJ_IDX.has(r[3])), (r) => r[3], custoMap);
    return mapToArr(map, (i) => RAW.projetos[i]).sort((a, b) => b.horas - a.horas).slice(0, 10);
  }, [filteredRows, custoMap]);

  const porFuncionario = useMemo(() => {
    const map = aggregateBy(filteredRows, (r) => r[1], custoMap);
    return mapToArr(map, (i) => RAW.colaboradores[i]).sort((a, b) => b.horas - a.horas).slice(0, 10);
  }, [filteredRows, custoMap]);

  const mensal = useMemo(() => {
    const map = aggregateBy(filteredRows, (r) => monthKey(r[0]), custoMap);
    return mapToArr(map, (k) => monthLabel(k)).sort((a, b) => a.key - b.key);
  }, [filteredRows, custoMap]);

  return (
    <div>
      <Section title="Indicadores Executivos">
        <div style={{ display: "flex", gap: 10, flexWrap: "wrap", marginBottom: 10 }}>
          <KpiCard label="HH Total" value={fmtH(kpis.horas)} />
          <KpiCard label="Custo Total" value={hasCusto ? fmtBRL(kpis.custo) : "—"} sub={hasCusto ? undefined : "cadastre custo/hora"} />
          <KpiCard label="Custo médio / HH" value={hasCusto && kpis.horas ? fmtBRL(kpis.custo / kpis.horas) : "—"} />
        </div>
        <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
          <KpiCard label="Projetos" value={kpis.projetos} />
          <KpiCard label="Funcionários" value={kpis.colabs} />
          <KpiCard label="Setores" value={kpis.setores} />
          <KpiCard label="Disciplinas" value={kpis.discs} />
        </div>
      </Section>

      <Section title="Visão Geral">
        <div style={{ display: "flex", gap: 12, flexWrap: "wrap" }}>
          <ChartBox title="Horas por projeto (top 10)">
            <BarChart data={porProjeto} layout="vertical" margin={{ left: 10, right: 10 }}>
              <CartesianGrid strokeDasharray="3 3" stroke="#1c242e" horizontal={false} />
              <XAxis type="number" tick={axisStyle} />
              <YAxis type="category" dataKey="nome" tick={{ ...axisStyle, fontSize: 10 }} width={130} />
              <Tooltip contentStyle={tooltipStyle} formatter={(v) => fmtH(v) + " h"} />
              <Bar dataKey="horas" fill="#3E7CB1" radius={[0, 2, 2, 0]} />
            </BarChart>
          </ChartBox>
          <ChartBox title="Horas por funcionário (top 10)">
            <BarChart data={porFuncionario} layout="vertical" margin={{ left: 10, right: 10 }}>
              <CartesianGrid strokeDasharray="3 3" stroke="#1c242e" horizontal={false} />
              <XAxis type="number" tick={axisStyle} />
              <YAxis type="category" dataKey="nome" tick={{ ...axisStyle, fontSize: 10 }} width={110} />
              <Tooltip contentStyle={tooltipStyle} formatter={(v) => fmtH(v) + " h"} />
              <Bar dataKey="horas" fill="#C97A2B" radius={[0, 2, 2, 0]} />
            </BarChart>
          </ChartBox>
          <ChartBox title="Evolução mensal das horas">
            <LineChart data={mensal}>
              <CartesianGrid strokeDasharray="3 3" stroke="#1c242e" />
              <XAxis dataKey="nome" tick={axisStyle} />
              <YAxis tick={axisStyle} />
              <Tooltip contentStyle={tooltipStyle} formatter={(v) => fmtH(v) + " h"} />
              <Line type="monotone" dataKey="horas" name="Horas" stroke="#3E7CB1" strokeWidth={2} dot={false} />
            </LineChart>
          </ChartBox>
          {hasCusto && (
            <ChartBox title="Evolução mensal do custo">
              <LineChart data={mensal}>
                <CartesianGrid strokeDasharray="3 3" stroke="#1c242e" />
                <XAxis dataKey="nome" tick={axisStyle} />
                <YAxis tick={axisStyle} tickFormatter={(v) => (v / 1000).toFixed(0) + "k"} />
                <Tooltip contentStyle={tooltipStyle} formatter={(v) => fmtBRL(v)} />
                <Line type="monotone" dataKey="custo" name="Custo" stroke="#3E7CB1" strokeWidth={2} dot={false} />
              </LineChart>
            </ChartBox>
          )}
        </div>
      </Section>
    </div>
  );
}

function ProjetosView({ filteredRows, custoMap, hasCusto }) {
  const rows = filteredRows.filter((r) => !PLACEHOLDER_PROJ_IDX.has(r[3]));
  const totalHoras = rows.reduce((s, r) => s + r[6], 0) || 1;
  const arr = useMemo(() => {
    const map = aggregateBy(rows, (r) => r[3], custoMap);
    return mapToArr(map, (i) => RAW.projetos[i]).sort((a, b) => b.horas - a.horas);
  }, [filteredRows, custoMap]);

  const cols = [
    { key: "nome", label: "Projeto" },
    { key: "horas", label: "Horas", mono: true, align: "right", render: (r) => fmtH(r.horas) },
    { key: "nColabs", label: "Funcionários", mono: true, align: "right" },
    { key: "nDias", label: "Dias", mono: true, align: "right" },
    { key: "mediaHorasDia", label: "Média h/dia", mono: true, align: "right", render: (r) => fmtH(r.mediaHorasDia) },
    { key: "pctTotal", label: "% do Total", mono: true, align: "right", render: (r) => fmtPct(r.horas / totalHoras) },
  ];
  if (hasCusto) cols.push({ key: "custo", label: "Custo", mono: true, align: "right", render: (r) => fmtBRL(r.custo) });

  return (
    <div>
      <Section title={`Ranking de Projetos por Horas (${arr.length})`}>
        <DataTable columns={cols} rows={arr} maxRows={30} />
      </Section>
      <Section title="Projetos que mais consomem HH">
        <ChartBox title="Top 15 — Horas totais" height={340}>
          <BarChart data={arr.slice(0, 15)} layout="vertical" margin={{ left: 10, right: 10 }}>
            <CartesianGrid strokeDasharray="3 3" stroke="#1c242e" horizontal={false} />
            <XAxis type="number" tick={axisStyle} />
            <YAxis type="category" dataKey="nome" tick={{ ...axisStyle, fontSize: 10 }} width={160} />
            <Tooltip contentStyle={tooltipStyle} formatter={(v) => fmtH(v) + " h"} />
            <Bar dataKey="horas" fill="#3E7CB1" radius={[0, 2, 2, 0]} />
          </BarChart>
        </ChartBox>
      </Section>
    </div>
  );
}

function OutrosRegistrosView({ filteredRows, custoMap, hasCusto }) {
  // "Outros Registros" = todos os lançamentos da disciplina OUTRA (não associados a um projeto).
  const outras = useMemo(() => filteredRows.filter((r) => isDisciplinaOutra(r)), [filteredRows]);
  const totalHoras = outras.reduce((s, r) => s + r[6], 0);
  const totalCusto = useMemo(() => outras.reduce((s, r) => s + rowCusto(r, custoMap), 0), [outras, custoMap]);

  const ORDEM_BASE = ["Atestado", "Férias", "Feriado", "Falta", "Reunião de Equipe"];

  const { categorias, porFuncionario, totalPorCategoria } = useMemo(() => {
    const porFunc = new Map(); // colabIdx -> { categorias: Map(cat->horas), horas, custo }
    const totalCat = new Map(); // categoria -> horas
    for (const r of outras) {
      const cat = categoriaOutra(r);
      const custo = rowCusto(r, custoMap);
      if (!porFunc.has(r[1])) porFunc.set(r[1], { categorias: new Map(), horas: 0, custo: 0 });
      const f = porFunc.get(r[1]);
      f.categorias.set(cat, (f.categorias.get(cat) || 0) + r[6]);
      f.horas += r[6];
      f.custo += custo;
      totalCat.set(cat, (totalCat.get(cat) || 0) + r[6]);
    }
    // Categorias conhecidas primeiro (na ordem pedida); demais nomes (se houver) depois, por volume.
    const extras = Array.from(totalCat.keys()).filter((c) => !ORDEM_BASE.includes(c)).sort((a, b) => totalCat.get(b) - totalCat.get(a));
    const categorias = [...ORDEM_BASE.filter((c) => totalCat.has(c)), ...extras];
    const porFuncionario = Array.from(porFunc.entries())
      .map(([idx, f]) => ({ idx, nome: RAW.colaboradores[idx], horas: f.horas, custo: f.custo, categorias: f.categorias }))
      .sort((a, b) => b.horas - a.horas);
    return { categorias, porFuncionario, totalPorCategoria: totalCat };
  }, [outras, custoMap]);

  const graficoDados = categorias.map((c) => ({ name: c, value: totalPorCategoria.get(c) || 0 }));
  const th = { textAlign: "left", padding: "8px 10px", color: "#7c8ba1", fontWeight: 600, fontSize: 10.5, letterSpacing: 0.4, textTransform: "uppercase", borderBottom: "1px solid #263241", whiteSpace: "nowrap" };
  const td = { padding: "7px 10px", color: "#dbe2ec", whiteSpace: "nowrap" };
  const tdNum = { ...td, textAlign: "right", fontFamily: "'JetBrains Mono', Consolas, monospace" };

  return (
    <div>
      <Section title="Outros Registros (disciplina OUTRA)">
        <div style={{ fontSize: 11, color: "#5c6b80", marginBottom: 12 }}>
          Reúne lançamentos sem projeto associado (Atestado, Férias, Feriado, Falta, Reunião de Equipe e eventuais outros). Não entram no ranking de projetos, mas continuam contando no custo do funcionário.
        </div>
        <div style={{ display: "flex", gap: 10, flexWrap: "wrap", marginBottom: 14 }}>
          <KpiCard label="Total de Horas em OUTRA" value={fmtH(totalHoras)} accent="#A13D3D" />
          {hasCusto && <KpiCard label="Custo Total em OUTRA" value={fmtBRL(totalCusto)} accent="#A13D3D" />}
        </div>
        <div style={{ display: "flex", gap: 12, flexWrap: "wrap" }}>
          <ChartBox title="Participação de cada categoria no total de horas">
            <PieChart>
              <Pie data={graficoDados} dataKey="value" nameKey="name" outerRadius={90} label={(d) => `${d.name} ${fmtPct(d.value / (totalHoras || 1))}`}>
                {graficoDados.map((e, i) => <Cell key={i} fill={PALETTE[i % PALETTE.length]} />)}
              </Pie>
              <Tooltip contentStyle={tooltipStyle} formatter={(v) => fmtH(v) + " h"} />
            </PieChart>
          </ChartBox>
          <ChartBox title="Horas por categoria">
            <BarChart data={graficoDados} layout="vertical" margin={{ left: 10, right: 10 }}>
              <CartesianGrid strokeDasharray="3 3" stroke="#1c242e" horizontal={false} />
              <XAxis type="number" tick={axisStyle} />
              <YAxis type="category" dataKey="name" tick={{ ...axisStyle, fontSize: 10 }} width={130} />
              <Tooltip contentStyle={tooltipStyle} formatter={(v) => fmtH(v) + " h"} />
              <Bar dataKey="value" fill="#A13D3D" radius={[0, 2, 2, 0]} />
            </BarChart>
          </ChartBox>
        </div>
      </Section>
      <Section title={`Detalhamento por Funcionário (${porFuncionario.length})`}>
        <div style={{ overflowX: "auto", border: "1px solid #263241", borderRadius: 3 }}>
          <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 12.5 }}>
            <thead>
              <tr style={{ background: "#141a22" }}>
                <th style={th}>Funcionário</th>
                {categorias.map((c) => <th key={c} style={{ ...th, textAlign: "right" }}>{c}</th>)}
                <th style={{ ...th, textAlign: "right" }}>Total</th>
                {hasCusto && <th style={{ ...th, textAlign: "right" }}>Custo</th>}
              </tr>
            </thead>
            <tbody>
              {porFuncionario.map((f) => (
                <tr key={f.idx} style={{ borderBottom: "1px solid #1c242e" }}>
                  <td style={td}>{f.nome}</td>
                  {categorias.map((c) => <td key={c} style={tdNum}>{f.categorias.has(c) ? fmtH(f.categorias.get(c)) : "—"}</td>)}
                  <td style={{ ...tdNum, fontWeight: 700 }}>{fmtH(f.horas)}</td>
                  {hasCusto && <td style={tdNum}>{fmtBRL(f.custo)}</td>}
                </tr>
              ))}
            </tbody>
            <tfoot>
              <tr style={{ borderTop: "2px solid #263241", background: "#141a22", fontWeight: 700 }}>
                <td style={td}>Total Geral</td>
                {categorias.map((c) => <td key={c} style={tdNum}>{fmtH(totalPorCategoria.get(c) || 0)}</td>)}
                <td style={tdNum}>{fmtH(totalHoras)}</td>
                {hasCusto && <td style={tdNum}>{fmtBRL(totalCusto)}</td>}
              </tr>
            </tfoot>
          </table>
        </div>
      </Section>
    </div>
  );
}

function CustosView({ filteredRows, custoMap, hasCusto }) {
  if (!hasCusto) {
    return (
      <div style={{ padding: 24, textAlign: "center", color: "#7c8ba1", border: "1px dashed #263241", borderRadius: 4 }}>
        Cadastre o custo/hora dos colaboradores na aba <b>Custo/Hora</b> para liberar esta análise.
      </div>
    );
  }
  const totalCusto = filteredRows.reduce((s, r) => s + rowCusto(r, custoMap), 0) || 1;

          columns={[

            { key: "custo", label: "Custo Total", mono: true, align: "right", render: (r) => fmtBRL(r.custo) },

function AlertasView({ filteredRows, custoMap, hasCusto, thresholds, setThresholds }) {
  const porFuncionario = useMemo(() => {
    const map = aggregateBy(filteredRows, (r) => r[1], custoMap);
    return mapToArr(map, (i) => RAW.colaboradores[i]);
  }, [filteredRows, custoMap]);

  const porProjeto = useMemo(() => {
    const map = aggregateBy(filteredRows.filter((r) => !PLACEHOLDER_PROJ_IDX.has(r[3])), (r) => r[3], custoMap);
    return mapToArr(map, (i) => RAW.projetos[i]);
  }, [filteredRows, custoMap]);

  // Detalhe de horas na disciplina "OUTRA" por funcionário, para o novo alerta.
  const porFuncionarioOutra = useMemo(() => {
    const map = new Map(); // colabIdx -> { totalHoras, outraHoras, categorias: Map(cat->horas) }
    for (const r of filteredRows) {
      if (!map.has(r[1])) map.set(r[1], { totalHoras: 0, outraHoras: 0, categorias: new Map() });
      const f = map.get(r[1]);
      f.totalHoras += r[6];
      if (isDisciplinaOutra(r)) {
        f.outraHoras += r[6];
        const cat = categoriaOutra(r);
        f.categorias.set(cat, (f.categorias.get(cat) || 0) + r[6]);
      }
    }
    return Array.from(map.entries()).map(([idx, f]) => ({
      idx, nome: RAW.colaboradores[idx], totalHoras: f.totalHoras, outraHoras: f.outraHoras,
      pct: f.totalHoras ? f.outraHoras / f.totalHoras : 0, categorias: f.categorias,
    }));
  }, [filteredRows]);

  const mediaHHProjeto = porProjeto.length ? porProjeto.reduce((s, p) => s + p.horas, 0) / porProjeto.length : 0;
  const custoMedioProjeto = porProjeto.length ? porProjeto.reduce((s, p) => s + p.custo, 0) / porProjeto.length : 0;

  const funcExcessoHoras = porFuncionario.filter((f) => f.mediaHorasDia >= thresholds.horasDiaMax).sort((a, b) => b.mediaHorasDia - a.mediaHorasDia);
  const projetosAltoHH = porProjeto.filter((p) => mediaHHProjeto > 0 && p.horas >= mediaHHProjeto * thresholds.hhMultiplicador).sort((a, b) => b.horas - a.horas);
  const projetosAltoCusto = hasCusto ? porProjeto.filter((p) => custoMedioProjeto > 0 && p.custo >= custoMedioProjeto * thresholds.hhMultiplicador).sort((a, b) => b.custo - a.custo) : [];
  // Novo alerta: percentual elevado de horas em OUTRA = horas do funcionário em OUTRA ÷ total de horas do funcionário × 100.
  // Limite configurável em thresholds.outraPct (constante inicial definida no App: outraPct: 20).
  const funcAltoOutra = porFuncionarioOutra.filter((f) => f.outraHoras > 0 && f.pct * 100 >= thresholds.outraPct).sort((a, b) => b.pct - a.pct);

  const numInput = (key, label) => (
    <label style={{ display: "flex", flexDirection: "column", gap: 3, fontSize: 11, color: "#7c8ba1" }}>
      {label}
      <input type="number" value={thresholds[key]} onChange={(e) => setThresholds((t) => ({ ...t, [key]: Number(e.target.value) }))}
        style={{ background: "#141a22", border: "1px solid #2c3a4d", borderRadius: 3, color: "#dbe2ec", padding: "5px 7px", width: 80, fontSize: 12 }} />
    </label>
  );

  const AlertList = ({ title, items, render }) => (
    <div style={{ marginBottom: 18 }}>
      <div style={{ fontSize: 12.5, fontWeight: 600, color: "#c3cee0", marginBottom: 6 }}>{title} <span style={{ color: "#5c6b80", fontWeight: 400 }}>({items.length})</span></div>
      {items.length === 0 ? (
        <div style={{ fontSize: 12, color: "#5c6b80", padding: "6px 0" }}>nenhum item acima do parâmetro</div>
      ) : (
        <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
          {items.slice(0, 12).map((it, i) => (
            <div key={i} style={{ display: "flex", justifyContent: "space-between", padding: "7px 10px", background: "#141a22", border: "1px solid #2c1f1f", borderLeft: "3px solid #A13D3D", borderRadius: 2, fontSize: 12.5 }}>
              {render(it)}
            </div>
          ))}
        </div>
      )}
    </div>
  );

  return (
    <div>
      <Section title="Parâmetros dos Alertas">
        <div style={{ display: "flex", gap: 18, flexWrap: "wrap" }}>
          {numInput("outraPct", "% horas em OUTRA (funcionário) ≥")}
          {numInput("horasDiaMax", "Média h/dia (funcionário) ≥")}
          {numInput("hhMultiplicador", "Múltiplo da média (projeto)")}
        </div>
      </Section>
      <Section title="Alertas Ativos">
        <div style={{ marginBottom: 18 }}>
          <div style={{ fontSize: 12.5, fontWeight: 600, color: "#c3cee0", marginBottom: 6 }}>
            Funcionários com percentual elevado de horas na disciplina OUTRA <span style={{ color: "#5c6b80", fontWeight: 400 }}>({funcAltoOutra.length})</span>
          </div>
          {funcAltoOutra.length === 0 ? (
            <div style={{ fontSize: 12, color: "#5c6b80", padding: "6px 0" }}>nenhum item acima do parâmetro</div>
          ) : (
            <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
              {funcAltoOutra.slice(0, 12).map((f) => (
                <div key={f.idx} style={{ padding: "7px 10px", background: "#141a22", border: "1px solid #2c1f1f", borderLeft: "3px solid #A13D3D", borderRadius: 2, fontSize: 12.5 }}>
                  <div style={{ display: "flex", justifyContent: "space-between" }}>
                    <span>{f.nome}</span>
                    <span style={{ fontFamily: "monospace" }}>{fmtPct(f.pct)} em OUTRA — {fmtH(f.outraHoras)} h de {fmtH(f.totalHoras)} h</span>
                  </div>
                  <div style={{ fontSize: 11, color: "#5c6b80", marginTop: 4 }}>
                    {Array.from(f.categorias.entries()).sort((a, b) => b[1] - a[1]).map(([cat, h]) => `${cat}: ${fmtH(h)} h`).join(" · ")}
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
        <AlertList title="Funcionários com excesso de horas (média diária alta)" items={funcExcessoHoras}
          render={(f) => <><span>{f.nome}</span><span style={{ fontFamily: "monospace" }}>{fmtH(f.mediaHorasDia)} h/dia</span></>} />
        <AlertList title="Projetos com consumo de HH muito acima da média" items={projetosAltoHH}
          render={(p) => <><span>{p.nome}</span><span style={{ fontFamily: "monospace" }}>{fmtH(p.horas)} h (média: {fmtH(mediaHHProjeto)} h)</span></>} />
        {hasCusto && <AlertList title="Projetos com custo muito acima da média" items={projetosAltoCusto}
          render={(p) => <><span>{p.nome}</span><span style={{ fontFamily: "monospace" }}>{fmtBRL(p.custo)} (média: {fmtBRL(custoMedioProjeto)})</span></>} />}
      </Section>
    </div>
  );
}

function CustoHoraView({ custoMap, updateCustos, loaded }) {
  const [q, setQ] = useState("");
  const [filtroSetor, setFiltroSetor] = useState(new Set());
  const [filtroDisciplina, setFiltroDisciplina] = useState(new Set());
  const [filtroProjeto, setFiltroProjeto] = useState(new Set());
  const [selecionados, setSelecionados] = useState(new Set());
  const [rascunhos, setRascunhos] = useState({});
  const [valorMassa, setValorMassa] = useState("");
  const [ordem, setOrdem] = useState({ chave: "nome", dir: "asc" });
  const [pagina, setPagina] = useState(0);
  const [mensagem, setMensagem] = useState("");
  const porPagina = 25;

  // Quando existir uma ACL no ambiente, use window.VIAVOZ_PERMISSOES.custoHora.colaboradores.
  // Sem uma ACL fornecida pelo sistema, mantém o comportamento atual: todos podem editar.
  const permitidos = window.VIAVOZ_PERMISSOES?.custoHora?.colaboradores;
  const podeEditar = (nome) => !Array.isArray(permitidos) || permitidos.includes(nome);

  const perfis = useMemo(() => {
    const mapa = new Map(RAW.colaboradores.map((nome) => [nome, { disciplinas: new Set(), setores: new Set(), projetos: new Set() }]));
    RAW.rows.forEach((r) => {
      const perfil = mapa.get(RAW.colaboradores[r[1]]); if (!perfil) return;
      if (r[2] >= 0) perfil.setores.add(RAW.setores[r[2]]);
      if (r[3] >= 0) perfil.projetos.add(RAW.projetos[r[3]]);
      if (r[4] >= 0) perfil.disciplinas.add(RAW.disciplinas[r[4]]);
    });
    return mapa;
  }, []);
  const possuiAlgum = (conjunto, filtro) => !filtro.size || [...conjunto].some((valor) => filtro.has(valor));
  const linhas = useMemo(() => RAW.colaboradores.map((nome) => {
    const perfil = perfis.get(nome) || { disciplinas: new Set(), setores: new Set(), projetos: new Set() };
    return { nome, disciplinas: [...perfil.disciplinas].sort().join(" • "), setores: [...perfil.setores].sort().join(" • "), perfil, atual: custoMap[nome] ?? "", novo: rascunhos[nome] ?? "" };
  }).filter((item) => {
    if (q && !item.nome.toUpperCase().includes(q.toUpperCase())) return false;
    return possuiAlgum(item.perfil.disciplinas, filtroDisciplina) && possuiAlgum(item.perfil.setores, filtroSetor) && possuiAlgum(item.perfil.projetos, filtroProjeto);
  }).sort((a, b) => {
    const av = a[ordem.chave] ?? "", bv = b[ordem.chave] ?? "";
    const cmp = ordem.chave === "atual" || ordem.chave === "novo" ? Number(av || 0) - Number(bv || 0) : String(av).localeCompare(String(bv), "pt-BR", { numeric: true });
    return ordem.dir === "asc" ? cmp : -cmp;
  }), [q, filtroDisciplina, filtroSetor, filtroProjeto, custoMap, perfis, ordem, rascunhos]);
  const totalPaginas = Math.max(1, Math.ceil(linhas.length / porPagina));
  const paginaAtual = Math.min(pagina, totalPaginas - 1);
  const visiveis = linhas.slice(paginaAtual * porPagina, (paginaAtual + 1) * porPagina);
  const selecionaveis = linhas.filter((item) => podeEditar(item.nome)).map((item) => item.nome);
  const todosSelecionados = selecionaveis.length > 0 && selecionaveis.every((nome) => selecionados.has(nome));
  const pendentes = Object.entries(rascunhos).filter(([nome, valor]) => podeEditar(nome) && String(valor) !== String(custoMap[nome] ?? ""));

  const valorValido = (valor) => {
    const numero = Number(String(valor).replace(",", "."));
    return String(valor).trim() !== "" && Number.isFinite(numero) && numero >= 0 ? numero : null;
  };
  const alternarOrdem = (chave) => setOrdem((atual) => atual.chave === chave ? { chave, dir: atual.dir === "asc" ? "desc" : "asc" } : { chave, dir: "asc" });
  const alternarSelecionado = (nome) => setSelecionados((atual) => { const proximo = new Set(atual); if (proximo.has(nome)) proximo.delete(nome); else proximo.add(nome); return proximo; });
  const selecionarTodos = () => setSelecionados((atual) => todosSelecionados ? new Set([...atual].filter((nome) => !selecionaveis.includes(nome))) : new Set([...atual, ...selecionaveis]));
  const aplicarEmMassa = () => {
    const valor = valorValido(valorMassa);
    const nomes = [...selecionados].filter(podeEditar);
    if (!nomes.length) return setMensagem("Selecione ao menos uma pessoa que você tenha permissão para editar.");
    if (valor === null) return setMensagem("Informe um custo/hora numérico, não negativo e diferente de vazio.");
    setRascunhos((atual) => ({ ...atual, ...Object.fromEntries(nomes.map((nome) => [nome, valor])) }));
    setMensagem(`Valor preparado para ${nomes.length} pessoa(s). Revise e clique em “Salvar alterações”.`);
  };
  const salvar = () => {
    const erros = pendentes.filter(([, valor]) => valorValido(valor) === null);
    if (erros.length) return setMensagem(`Há ${erros.length} valor(es) inválido(s). Corrija-os antes de salvar.`);
    if (!pendentes.length) return setMensagem("Não há alterações válidas para salvar.");
    if (!window.confirm(`Salvar o custo/hora de ${pendentes.length} pessoa(s)?`)) return;
    const alteracoes = Object.fromEntries(pendentes.map(([nome, valor]) => [nome, valorValido(valor)]));
    try {
      updateCustos(alteracoes); setRascunhos({}); setSelecionados(new Set()); setValorMassa("");
      setMensagem(`${Object.keys(alteracoes).length} registro(s) atualizado(s) com sucesso.`);
    } catch (e) { setMensagem(`Não foi possível salvar as alterações: ${e.message || "erro desconhecido"}`); }
  };
  const cancelar = () => { setRascunhos({}); setSelecionados(new Set()); setValorMassa(""); setMensagem("Alterações pendentes e seleção canceladas."); };
  const limparFiltros = () => { setQ(""); setFiltroSetor(new Set()); setFiltroDisciplina(new Set()); setFiltroProjeto(new Set()); setPagina(0); };
  const cabecalho = (chave, titulo) => <th onClick={() => alternarOrdem(chave)} style={{ textAlign: chave === "atual" ? "right" : "left", padding: "8px 10px", color: "#7c8ba1", fontSize: 10.5, textTransform: "uppercase", cursor: "pointer", whiteSpace: "nowrap" }}>{titulo} {ordem.chave === chave ? (ordem.dir === "asc" ? "↑" : "↓") : "↕"}</th>;

  return <div>
    <Section title="Cadastro de Custo por Hora" right={<input placeholder="Pesquisar por nome..." value={q} onChange={(e) => { setQ(e.target.value); setPagina(0); }} style={{ background: "#141a22", border: "1px solid #2c3a4d", borderRadius: 3, color: "#dbe2ec", padding: "6px 8px", fontSize: 12, width: 210 }} />}>
      <p style={{ fontSize: 12, color: "#7c8ba1", marginTop: -4 }}>Selecione pessoas, aplique valores em massa e salve tudo de uma vez. {!loaded && "Carregando custos..."}</p>
      <div style={{ display: "flex", gap: 8, flexWrap: "wrap", padding: 10, marginBottom: 10, background: "#10151d", border: "1px solid #263241", borderRadius: 4 }}>
        <MultiSelect label="Disciplina" options={RAW.disciplinas.map((nome) => ({ label: nome, value: nome }))} selected={filtroDisciplina} onChange={(v) => { setFiltroDisciplina(v); setPagina(0); }} />
        <MultiSelect label="Setor" options={RAW.setores.map((nome) => ({ label: nome, value: nome }))} selected={filtroSetor} onChange={(v) => { setFiltroSetor(v); setPagina(0); }} />
        <MultiSelect label="Projeto" options={RAW.projetos.map((nome) => ({ label: nome, value: nome }))} selected={filtroProjeto} onChange={(v) => { setFiltroProjeto(v); setPagina(0); }} />
        <button onClick={limparFiltros} style={btnGhost}>limpar filtros</button><button onClick={() => setSelecionados(new Set())} style={btnGhost}>limpar seleção</button>
        <span style={{ marginLeft: "auto", color: "#9fb0c6", fontSize: 12, alignSelf: "center" }}>{linhas.length} pessoa(s) · {selecionados.size} selecionada(s)</span>
      </div>
      <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center", padding: 10, marginBottom: 10, background: "#141a22", border: "1px solid #2c3a4d", borderRadius: 4 }}>
        <button onClick={selecionarTodos} style={btnGhost}>{todosSelecionados ? "desmarcar todos" : "selecionar todos"}</button>
        <input type="number" min="0" step="0.01" value={valorMassa} onChange={(e) => setValorMassa(e.target.value)} placeholder="Novo custo/hora (R$)" style={{ background: "#0c1016", border: "1px solid #2c3a4d", borderRadius: 3, color: "#dbe2ec", padding: "6px 8px", width: 170, fontFamily: "monospace" }} />
        <button onClick={aplicarEmMassa} style={btnPrimary}>Aplicar valor aos selecionados</button><button onClick={salvar} style={btnPrimary}>Salvar alterações ({pendentes.length})</button><button onClick={cancelar} style={btnGhost}>Cancelar</button>
      </div>
      {mensagem && <div style={{ marginBottom: 10, fontSize: 12, color: mensagem.includes("sucesso") ? "#8ebf91" : "#dbc47c" }}>{mensagem}</div>}
      <div style={{ overflowX: "auto", border: "1px solid #263241", borderRadius: 3 }}><table style={{ width: "100%", borderCollapse: "collapse", fontSize: 12 }}><thead><tr style={{ background: "#141a22" }}>
        <th style={{ padding: "8px 10px", width: 36 }}><input type="checkbox" checked={todosSelecionados} onChange={selecionarTodos} title="Selecionar todos" /></th>{cabecalho("nome", "Pessoa")}{cabecalho("disciplinas", "Disciplina")}{cabecalho("setores", "Setor")}{cabecalho("atual", "Custo atual")}{cabecalho("novo", "Novo custo/hora")}
      </tr></thead><tbody>{visiveis.map((item) => {
        const temRascunho = Object.prototype.hasOwnProperty.call(rascunhos, item.nome); const valor = temRascunho ? rascunhos[item.nome] : ""; const editavel = podeEditar(item.nome); const invalido = temRascunho && valorValido(valor) === null;
        return <tr key={item.nome} style={{ borderBottom: "1px solid #1c242e", background: temRascunho ? "#172a20" : "transparent", opacity: editavel ? 1 : .55 }}><td style={{ padding: "6px 10px", textAlign: "center" }}><input type="checkbox" disabled={!editavel} checked={selecionados.has(item.nome)} onChange={() => alternarSelecionado(item.nome)} /></td><td style={{ padding: "6px 10px", whiteSpace: "nowrap" }}>{item.nome}{!editavel && <span style={{ color: "#7c8ba1" }}> (sem permissão)</span>}</td><td style={{ padding: "6px 10px" }}>{item.disciplinas || "—"}</td><td style={{ padding: "6px 10px" }}>{item.setores || "—"}</td><td style={{ padding: "6px 10px", textAlign: "right", fontFamily: "monospace" }}>{item.atual === "" ? "—" : fmtBRL(item.atual)}</td><td style={{ padding: "6px 10px", textAlign: "right" }}><input type="number" min="0" step="0.01" disabled={!editavel} value={valor} placeholder="0,00" onChange={(e) => setRascunhos((atual) => ({ ...atual, [item.nome]: e.target.value }))} style={{ background: invalido ? "#3a1d1d" : "#0c1016", border: `1px solid ${invalido ? "#e08787" : "#2c3a4d"}`, borderRadius: 3, color: "#dbe2ec", padding: "4px 7px", width: 105, textAlign: "right", fontFamily: "monospace" }} /></td></tr>;
      })}</tbody></table></div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", paddingTop: 9, fontSize: 11.5, color: "#7c8ba1" }}><span>Página {paginaAtual + 1} de {totalPaginas} · {visiveis.length} de {linhas.length} pessoas</span><span><button disabled={paginaAtual === 0} onClick={() => setPagina((p) => Math.max(0, p - 1))} style={btnGhost}>anterior</button> <button disabled={paginaAtual >= totalPaginas - 1} onClick={() => setPagina((p) => Math.min(totalPaginas - 1, p + 1))} style={btnGhost}>próxima</button></span></div>
    </Section>
  </div>;
}

function RevisaoView() {
  const qtdOutra = useMemo(() => RAW.rows.filter((r) => isDisciplinaOutra(r)).length, []);
  const ORDEM_PRIORIDADE = { "Alta": 0, "Média": 1, "Baixa": 2 };

  const itens = useMemo(() => ([
    {
      descricao: "O conceito de horas produtivas/improdutivas, percentual de produtividade, custo produtivo e custo improdutivo foi removido de todo o programa (indicadores, filtros, tabelas, colunas, gráficos e alertas).",
      area: "Geral (Dashboard e todas as abas)",
      prioridade: "Alta",
      qtd: RAW.rows.length,
    },
    {
      descricao: "A disciplina \"OUTRA\" deixou de ser tratada como tempo improdutivo. Seus lançamentos passaram a ter análise própria na aba \"Outros Registros\", agrupados por Atestado, Férias, Feriado, Falta, Reunião de Equipe e eventuais outros projetos.",
      area: "Outros Registros",
      prioridade: "Alta",
      qtd: qtdOutra,
    },
    {
      descricao: "O filtro \"Tipo de Horas\" foi removido de todas as abas em que estava disponível.",
      area: "Filtros globais",
      prioridade: "Média",
      qtd: null,
    },
    {
      descricao: "O cálculo de custo foi preservado: os registros da disciplina OUTRA usam a mesma regra de custo/hora aplicada aos demais registros e projetos (não são tratados como isentos de custo).",
      area: "Custos / Outros Registros",
      prioridade: "Média",
      qtd: qtdOutra,
    },
    {
      descricao: "A coluna \"Projeto\" foi removida da tabela de Custo/Hora, já que o cadastro é feito por pessoa e o nome dos projetos não é necessário nessa tela.",
      area: "Custo/Hora",
      prioridade: "Baixa",
      qtd: RAW.colaboradores.length,
    },
  ]), [qtdOutra]);

  const ordenados = [...itens].sort((a, b) => {
    const p = ORDEM_PRIORIDADE[a.prioridade] - ORDEM_PRIORIDADE[b.prioridade];
    if (p !== 0) return p;
    return (b.qtd ?? -1) - (a.qtd ?? -1);
  });

  const corPrioridade = { "Alta": "#A13D3D", "Média": "#C97A2B", "Baixa": "#5C8A5C" };

  return (
    <div>
      <Section title="Revisão das Alterações">
        <p style={{ fontSize: 12, color: "#7c8ba1", marginTop: -4, marginBottom: 16 }}>
          Resumo das mudanças feitas na reestruturação que eliminou a classificação produtivo/improdutivo, ordenado por prioridade e, dentro de cada prioridade, pela quantidade de registros afetados.
        </p>
        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          {ordenados.map((item, i) => (
            <div key={i} style={{ padding: "12px 14px", background: "#141a22", border: "1px solid #263241", borderLeft: `3px solid ${corPrioridade[item.prioridade]}`, borderRadius: 3 }}>
              <div style={{ fontSize: 13, color: "#dbe2ec", marginBottom: 8, lineHeight: 1.5 }}>{item.descricao}</div>
              <div style={{ display: "flex", gap: 16, flexWrap: "wrap", fontSize: 11, color: "#7c8ba1" }}>
                <span><b style={{ color: "#9fb0c6" }}>Área:</b> {item.area}</span>
                <span><b style={{ color: "#9fb0c6" }}>Prioridade:</b> <span style={{ color: corPrioridade[item.prioridade] }}>{item.prioridade}</span></span>
                {item.qtd !== null && <span><b style={{ color: "#9fb0c6" }}>Registros afetados:</b> {item.qtd.toLocaleString("pt-BR")}</span>}
              </div>
            </div>
          ))}
        </div>
      </Section>
    </div>
  );
}


createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
