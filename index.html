const registrarErro = (erro, origem = "JavaScript") => {
  const item = {
    id: `${Date.now()}-${Math.random().toString(16).slice(2)}`,
    origem, mensagem: erro?.message || String(erro || "Erro desconhecido"), stack: erro?.stack || "",

  try { localStorage.setItem("viavoz_error_logs", JSON.stringify(window.__viavozErrorLogs)); } catch (e) {}
};
try {
  const salvos = JSON.parse(localStorage.getItem("viavoz_error_logs") || "[]");
  if (Array.isArray(salvos)) window.__viavozErrorLogs = salvos;
} catch (e) {}
window.addEventListener("error", (evento) => registrarErro(evento.error || new Error(evento.message), "Erro JavaScript"));
window.addEventListener("unhandledrejection", (evento) => registrarErro(evento.reason, "Promise não tratada"));
document.addEventListener("click", (evento) => {

function csvParaLinhas(texto) {
  const linhas = [];
  let linha = [], campo = "", aspas = false;
  for (let i = 0; i < texto.length; i++) {
    const ch = texto[i], prox = texto[i + 1];
    if (ch === '"' && aspas && prox === '"') { campo += '"'; i++; }
    else if (ch === '"') aspas = !aspas;
    else if (ch === ',' && !aspas) { linha.push(campo.trim()); campo = ""; }
    else if ((ch === '\n' || ch === '\r') && !aspas) {
      if (ch === '\r' && prox === '\n') i++;
      linha.push(campo.trim());
      if (linha.some((v) => v !== "")) linhas.push(linha);
      linha = []; campo = "";
    } else campo += ch;
  }
  linha.push(campo.trim());
  if (linha.some((v) => v !== "")) linhas.push(linha);
  return linhas;
}

function montarRAWDeCSV(texto) {
  const linhas = csvParaLinhas(texto);
  if (linhas.length < 2) throw new Error("O CSV não possui registros.");
  const cab = linhas[0].map((v) => v.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim());
  const indice = (nomes) => cab.findIndex((v) => nomes.includes(v));
  const col = {
    data: indice(["data", "date"]), colaborador: indice(["colaborador", "funcionario", "nome"]), setor: indice(["setor"]),
    projeto: indice(["projeto", "obra"]), disciplina: indice(["disciplina"]), tarefa: indice(["tarefa", "atividade"]),
    horas: indice(["horas", "hora", "hh"]), tipo: indice(["tipo", "tipo de hora"]),
  };
  if (col.data < 0 || col.colaborador < 0 || col.horas < 0) throw new Error("O CSV precisa das colunas Data, Colaborador e Horas.");
  const dataInt = (valor) => {
    const digitos = String(valor || "").replace(/\D/g, "");
    return digitos.length === 8 && !/^(19|20)/.test(digitos) ? digitos.slice(4) + digitos.slice(2, 4) + digitos.slice(0, 2) : digitos;
  };
  const registros = linhas.slice(1).map((linha) => ({
    data: dataInt(linha[col.data]), colaborador: linha[col.colaborador] || "", setor: linha[col.setor] || "",
    projeto: linha[col.projeto] || "", disciplina: linha[col.disciplina] || "", tarefa: linha[col.tarefa] || "",
    horas: Number(String(linha[col.horas] || "0").replace(",", ".")) || 0, tipo: linha[col.tipo] || "Produtiva",
  })).filter((r) => r.data && r.colaborador);
  const unico = (chave) => Array.from(new Set(registros.map((r) => r[chave]).filter(Boolean))).sort((a, b) => a.localeCompare(b, "pt-BR"));
  const colaboradores = unico("colaborador"), setores = unico("setor"), projetos = unico("projeto"), disciplinas = unico("disciplina"), tarefas = unico("tarefa");
  const tipos = ["Produtiva", "Gestao", "Reuniao", "Administrativo", "Atestado", "Ferias", "Falta", "Treinamento", "Servico Interno", "Feriado", "Outros"];
  const tipoNormalizado = new Map(tipos.map((v, i) => [v.toUpperCase().replace(/\s/g, ""), i]));
  const tipoIdx = (valor) => tipoNormalizado.get(String(valor).normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase().replace(/\s/g, "")) ?? 10;
  const mapa = (arr) => new Map(arr.map((v, i) => [v, i]));
  const ci = mapa(colaboradores), si = mapa(setores), pi = mapa(projetos), di = mapa(disciplinas), ti = mapa(tarefas);
  return { colaboradores, setores, projetos, disciplinas, tarefas, tipos, rows: registros.map((r) => [Number(r.data), ci.get(r.colaborador), si.get(r.setor) ?? -1, pi.get(r.projeto) ?? -1, di.get(r.disciplina) ?? -1, ti.get(r.tarefa) ?? -1, r.horas, tipoIdx(r.tipo), 0, 0]) };
}

const CAMPOS_IMPORTACAO = [
  ["Data", true, ["data", "date"]], ["Colaborador", true, ["colaborador", "funcionario", "nome"]],
  ["Horas", true, ["horas", "hora", "hh"]], ["Setor", false, ["setor"]], ["Projeto", false, ["projeto", "obra"]],
  ["Disciplina", false, ["disciplina"]], ["Tarefa", false, ["tarefa", "atividade"]], ["Tipo", false, ["tipo", "tipo de hora"]],
];
const nomeSimilar = (valor) => String(valor || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
const escaparCSV = (valor) => `"${String(valor ?? "").replace(/"/g, '""')}"`;

function ImportarPlanilhaModal({ onClose, onImportar }) {
  const arquivoRef = useRef(null);
  const [arquivo, setArquivo] = useState(null), [cabecalhos, setCabecalhos] = useState([]), [linhas, setLinhas] = useState([]);
  const [mapa, setMapa] = useState({}), [erro, setErro] = useState(""), [validacao, setValidacao] = useState(null);
  const carregar = async (file) => {
    setErro(""); setValidacao(null);
    if (!file || !/\.xlsx$/i.test(file.name)) { setErro("Selecione um arquivo .xlsx."); return; }
    if (!window.XLSX) { setErro("A biblioteca de leitura não foi carregada. Verifique sua conexão e tente novamente."); return; }
    try {
      const livro = window.XLSX.read(await file.arrayBuffer(), { type: "array", cellDates: true });
      const planilha = livro.Sheets[livro.SheetNames[0]];
      const matriz = window.XLSX.utils.sheet_to_json(planilha, { header: 1, defval: "", raw: false });
      if (matriz.length < 2) throw new Error("A primeira planilha não possui linhas de dados.");
      const headers = matriz[0].map((v, i) => String(v || `Coluna ${i + 1}`));
      const sugestao = {};
      CAMPOS_IMPORTACAO.forEach(([campo,, sinonimos]) => {
        const idx = headers.findIndex((h) => sinonimos.includes(nomeSimilar(h)) || sinonimos.some((s) => nomeSimilar(h).includes(s)));
        sugestao[campo] = idx >= 0 ? String(idx) : "";
      });
      setArquivo(file); setCabecalhos(headers); setLinhas(matriz.slice(1).filter((l) => l.some((v) => v !== ""))); setMapa(sugestao);
    } catch (e) { registrarErro(e, "Importação de planilha"); setErro(`Não foi possível ler a planilha: ${e.message}`); }
  };
  const validar = () => {
    const obrigatorios = CAMPOS_IMPORTACAO.filter(([, obrigatorio]) => obrigatorio).filter(([campo]) => mapa[campo] === "");
    if (obrigatorios.length) { setErro(`Mapeie os campos obrigatórios: ${obrigatorios.map(([c]) => c).join(", ")}.`); return null; }
    const indice = (campo) => Number(mapa[campo]);
    const invalidas = linhas.map((linha, pos) => {
      const horas = String(linha[indice("Horas")] ?? "").replace(",", ".");
      const data = linha[indice("Data")];
      return (!String(data ?? "").trim() || !String(linha[indice("Colaborador")] ?? "").trim() || !Number.isFinite(Number(horas))) ? pos + 2 : null;
    }).filter(Boolean);
    const resultado = { invalidas, validas: linhas.length - invalidas.length };
    setValidacao(resultado); setErro(""); return resultado;
  };
  const confirmar = () => {
    const resultado = validar();
    if (!resultado || resultado.invalidas.length) return;
    const campos = CAMPOS_IMPORTACAO.map(([campo]) => campo);
    const texto = [campos, ...linhas].map((linha) => campos.map((campo) => mapa[campo] === "" ? "" : linha[Number(mapa[campo])] ?? "").map(escaparCSV).join(",")).join("\n");
    onImportar(montarRAWDeCSV(texto), arquivo.name);

// Busca todos os registros de horas do banco e monta a mesma estrutura RAW
// que o painel usava antes (colaboradores/setores/projetos/disciplinas/tarefas + rows indexados).
async function carregarDadosSupabase() {
  let todos = [];
  let from = 0;
  const pageSize = 1000;
  // pagina em blocos de 1000 (limite padrão de linhas por consulta no Supabase)
  while (true) {
    const { data, error } = await sb
      .from("registros")
      .select("colaborador,obra,data,horas,setor,disciplina,tarefa")
      .range(from, from + pageSize - 1);
    if (error) throw error;
    if (!data || data.length === 0) break;
    todos = todos.concat(data);
    if (data.length < pageSize) break;
    from += pageSize;
  }

  const uniqueSorted = (arr) =>
    Array.from(new Set(arr.filter((v) => v !== null && v !== undefined && v !== "")))
      .sort((a, b) => String(a).localeCompare(String(b), "pt-BR"));

  const colaboradores = uniqueSorted(todos.map((r) => r.colaborador));
  const setores = uniqueSorted(todos.map((r) => r.setor));
  const projetos = uniqueSorted(todos.map((r) => r.obra));
  const disciplinas = uniqueSorted(todos.map((r) => r.disciplina));
  const tarefas = uniqueSorted(todos.map((r) => r.tarefa));

  const idxOf = (arr) => {
    const m = new Map();
    arr.forEach((v, i) => m.set(v, i));
    return m;
  };
  const colabIdx = idxOf(colaboradores);
  const setorIdx = idxOf(setores);
  const projIdx = idxOf(projetos);
  const discIdx = idxOf(disciplinas);
  const tarefaIdx = idxOf(tarefas);

  const rows = todos.map((r) => {
    const dateInt = r.data ? parseInt(String(r.data).replace(/-/g, ""), 10) : 0;
    const horas = Number(r.horas) || 0;
    return [
      dateInt,
      r.colaborador ? (colabIdx.has(r.colaborador) ? colabIdx.get(r.colaborador) : -1) : -1,
      r.setor ? (setorIdx.has(r.setor) ? setorIdx.get(r.setor) : -1) : -1,
      r.obra ? (projIdx.has(r.obra) ? projIdx.get(r.obra) : -1) : -1,
      r.disciplina ? (discIdx.has(r.disciplina) ? discIdx.get(r.disciplina) : -1) : -1,
      r.tarefa ? (tarefaIdx.has(r.tarefa) ? tarefaIdx.get(r.tarefa) : -1) : -1,
      horas,
      0, // tipo: o banco novo não guarda a classificação (Produtiva/Reunião/Férias...);
         // por isso tratamos todo apontamento como "Produtiva" até esse campo existir na tabela.
      0,
      0,
    ];
  });

  RAW = { colaboradores, setores, projetos, disciplinas, tarefas, tipos: ["Produtiva"], rows };
  recomputePlaceholderProjIdx();
}

// Regra de produtividade (ajustada pelo usuário): Serviço Interno, Reunião e Gestão contam
// como horas E custo produtivos. Férias/Feriado/Treinamento continuam improdutivas em horas,
// mas não geram custo.
const ZERO_COST_TIPOS = new Set([5, 7, 9]); // Ferias, Treinamento, Feriado
const PRODUCTIVE_TIPOS = new Set([1, 2, 8]); // Gestao, Reuniao, Servico Interno

function isProdRow(r) {
  return r[7] === 0 || PRODUCTIVE_TIPOS.has(r[7]);
}

function rowCusto(r, custoMap) {
  if (ZERO_COST_TIPOS.has(r[7])) return { custo: 0, isProdCost: true };
  const custoHora = custoMap[RAW.colaboradores[r[1]]] || 0;
  const custo = r[6] * custoHora;
  return { custo, isProdCost: isProdRow(r) };
}

// ---------- generic aggregation ----------
function aggregateBy(rows, keyFn, custoMap, includeIdx) {
  const map = new Map();
  for (const r of rows) {
    const key = keyFn(r);
    if (key === null || key === undefined) continue;
    if (!map.has(key)) {
      map.set(key, {
        horas: 0, prod: 0, naoProd: 0, custo: 0, custoProd: 0, custoNaoProd: 0,
        colabs: new Set(), dias: new Set(), projetos: new Set(), n: 0,
      });
    }
    const g = map.get(key);
    const { custo, isProdCost } = rowCusto(r, custoMap);
    const prodHoras = isProdRow(r);
    g.horas += r[6];
    g.n += 1;
    if (prodHoras) { g.prod += r[6]; } else { g.naoProd += r[6]; }
    if (isProdCost) { g.custoProd += custo; } else { g.custoNaoProd += custo; }
    g.custo += custo;
    g.colabs.add(r[1]);
    g.dias.add(r[0]);
    g.projetos.add(r[3]);
  }
  return map;
}

function mapToArr(map, nameOf) {
  return Array.from(map.entries()).map(([key, g]) => ({
    key, nome: nameOf(key), horas: g.horas, prod: g.prod, naoProd: g.naoProd,
    custo: g.custo, custoProd: g.custoProd, custoNaoProd: g.custoNaoProd,
    nColabs: g.colabs.size, nDias: g.dias.size, nProjetos: g.projetos.size, n: g.n,
    produtividade: g.horas ? g.prod / g.horas : 0,
    mediaHorasDia: g.dias.size ? g.horas / g.dias.size : 0,
  }));
}

function DataTable({ columns, rows, maxRows = 25 }) {
  const [ordem, setOrdem] = useState(null);
  const ordenados = useMemo(() => {
    if (!ordem) return rows;
    const coluna = columns.find((c) => c.key === ordem.key);
    return [...rows].sort((a, b) => {
      const av = a[ordem.key] ?? "", bv = b[ordem.key] ?? "";
      const n = typeof av === "number" && typeof bv === "number" ? av - bv : String(av).localeCompare(String(bv), "pt-BR", { numeric: true });
      return ordem.dir === "asc" ? n : -n;
    });
  }, [rows, columns, ordem]);
  const shown = ordenados.slice(0, maxRows);
  const ordenar = (key) => setOrdem((atual) => atual && atual.key === key ? { key, dir: atual.dir === "asc" ? "desc" : "asc" } : { key, dir: "asc" });
  return (
    <div style={{ overflowX: "auto", border: "1px solid #263241", borderRadius: 3 }}>

              }} onClick={() => ordenar(c.key)} title="Ordenar por esta coluna">{c.label} {ordem && ordem.key === c.key ? (ordem.dir === "asc" ? "↑" : "↓") : "↕"}</th>
            ))}
          </tr>
        </thead>
        <tbody>
          {shown.map((row, i) => (
            <tr key={i} style={{ borderBottom: "1px solid #1c242e" }}>
              {columns.map((c) => (

  useEffect(() => {
    if (!session) return;
    let mounted = true;
    (async () => {
      setDataLoading(true);
      setDataError(null);
      try {
        await carregarDadosSupabase();
        if (mounted) {
          setDataVersion((v) => v + 1);
          setUltimaAtualizacao(new Date());
        }
      } catch (e) {
        registrarErro(e, "Supabase - carregamento de dados");
        if (mounted) setDataError((e && e.message) || "Erro ao carregar os dados do banco.");
      }
      if (mounted) setDataLoading(false);
    })();
    return () => { mounted = false; };
  }, [session]);

  // Botão "Atualizar dados": busca de novo no Supabase sem precisar recarregar a página inteira.
  async function atualizarDadosManual() {
    setAtualizandoManual(true);
    setErroAtualizar("");
    try {
      await carregarDadosSupabase();
      setDataVersion((v) => v + 1);
      setUltimaAtualizacao(new Date());
    } catch (e) {
      registrarErro(e, "Supabase - atualização manual");
      setErroAtualizar((e && e.message) || "Erro ao atualizar os dados.");
    }
    setAtualizandoManual(false);
  }

  const fmtUltimaAtualizacao = (d) => {
    if (!d) return "";
    const pad = (n) => String(n).padStart(2, "0");
    return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()} às ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  };

  async function handleLogin(e) {
    e.preventDefault();
    setLoginErro("");
    setLoginCarregando(true);
    const { error } = await sb.auth.signInWithPassword({ email: loginEmail, password: loginSenha });
    setLoginCarregando(false);
    if (error) { registrarErro(new Error(error.message), "Supabase - login"); setLoginErro(error.message === "Invalid login credentials" ? "E-mail ou senha inválidos." : error.message); }
  }

  const pageWrapStyle = { fontFamily: "'Inter', 'Helvetica Neue', Arial, sans-serif", background: "#0c1016", color: "#dbe2ec", minHeight: "100vh", padding: 16, display: "flex", alignItems: "center", justifyContent: "center" };

  useEffect(() => {
    // Nesta versão publicada fora do Claude, usamos localStorage (guardado só neste navegador)
    // em vez do window.storage do Claude, que só existe dentro do ambiente de artifacts.
    try {
      const raw = localStorage.getItem("custo_hora_colaboradores");
      if (raw) setCustoMap(JSON.parse(raw));
    } catch (e) { /* sem dado salvo ainda */ }
    setCustoLoaded(true);
  }, []);

  const updateCusto = useCallback((nome, valor) => {
    setCustoMap((prev) => {
      const next = { ...prev, [nome]: valor };
      try { localStorage.setItem("custo_hora_colaboradores", JSON.stringify(next)); } catch (e) {}
      return next;
    });
  }, []);

  const updateCustos = useCallback((nomes, valor) => {
    setCustoMap((prev) => {
      const next = { ...prev };
      nomes.forEach((nome) => { next[nome] = valor; });
      try { localStorage.setItem("custo_hora_colaboradores", JSON.stringify(next)); } catch (e) {}
      return next;
    });
  }, []);

  const hasCusto = Object.keys(custoMap).length > 0;

  const dateFromInt2 = (s) => s ? parseInt(s.replace(/-/g, ""), 10) : null;

  const filteredRows = useMemo(() => {
    const df = dateFromInt2(filters.dateFrom);
    const dt = dateFromInt2(filters.dateTo);
    const tSearch = filters.tarefaSearch.trim().toUpperCase();
    return RAW.rows.filter((r) => {
      if (df && r[0] < df) return false;
      if (dt && r[0] > dt) return false;
      if (filters.colab.size && !filters.colab.has(r[1])) return false;
      if (filters.setor.size && !filters.setor.has(r[2])) return false;
      if (filters.projeto.size && !filters.projeto.has(r[3])) return false;
      if (filters.disciplina.size && !filters.disciplina.has(r[4])) return false;
      if (filters.tipo.size && !filters.tipo.has(r[7])) return false;
      if (tSearch && (r[5] === -1 || !RAW.tarefas[r[5]].toUpperCase().includes(tSearch))) return false;
      return true;
    });
  }, [filters, dataVersion]);

  useEffect(() => {
    try {
      localStorage.setItem("viavoz_aba", view);
      localStorage.setItem("viavoz_filtros", JSON.stringify({ ...filters, colab: [...filters.colab], setor: [...filters.setor], projeto: [...filters.projeto], disciplina: [...filters.disciplina], tipo: [...filters.tipo] }));
      const url = new URL(window.location.href);
      url.searchParams.set("aba", view);
      window.history.replaceState({}, "", url);
    } catch (e) { /* navegação local sem persistência disponível */ }
  }, [view, filters]);

  const kpis = useMemo(() => {
    let horas = 0, prod = 0, custo = 0, custoProd = 0, custoNaoProd = 0;
    const colabs = new Set(), setores = new Set(), projetos = new Set(), discs = new Set();
    for (const r of filteredRows) {
      horas += r[6];
      const { custo: c, isProdCost } = rowCusto(r, custoMap);
      custo += c;
      if (isProdRow(r)) prod += r[6];
      if (isProdCost) custoProd += c; else custoNaoProd += c;
      colabs.add(r[1]); setores.add(r[2]); discs.add(r[4]);
      if (!PLACEHOLDER_PROJ_IDX.has(r[3])) projetos.add(r[3]);
    }
    const naoProd = horas - prod;
    return { horas, prod, naoProd, custo, custoProd, custoNaoProd, colabs: colabs.size, setores: setores.size, projetos: projetos.size, discs: discs.size };
  }, [filteredRows, custoMap, dataVersion]);

  const opt = (arr, excludeSet) => arr.map((v, i) => [v, i]).filter(([, i]) => !excludeSet || !excludeSet.has(i)).map(([v, i]) => ({ label: v, value: i }));

  const dataParaExcel = (dataInt) => {
    const texto = String(dataInt || "");
    return new Date(Number(texto.slice(0, 4)), Number(texto.slice(4, 6)) - 1, Number(texto.slice(6, 8)));
  };
  const estiloCabecalhoExcel = { font: { bold: true, color: { rgb: "FFFFFF" } }, fill: { fgColor: { rgb: "1F4E78" } }, alignment: { horizontal: "center", vertical: "center" } };
  const estiloZebraExcel = { fill: { fgColor: { rgb: "EAF2F8" } } };
  const adicionarAbaExcel = (livro, nome, cabecalhos, linhas, colunasData = [], colunasNumericas = []) => {
    const aba = window.XLSX.utils.aoa_to_sheet([cabecalhos, ...linhas], { cellDates: true });
    const alcance = window.XLSX.utils.decode_range(aba["!ref"] || "A1");
    for (let coluna = alcance.s.c; coluna <= alcance.e.c; coluna++) {
      const celula = aba[window.XLSX.utils.encode_cell({ r: 0, c: coluna })];
      if (celula) celula.s = estiloCabecalhoExcel;
    }
    for (let linha = 1; linha <= alcance.e.r; linha++) {
      for (let coluna = alcance.s.c; coluna <= alcance.e.c; coluna++) {
        const celula = aba[window.XLSX.utils.encode_cell({ r: linha, c: coluna })];
        if (!celula) continue;
        if (linha % 2 === 0) celula.s = { ...estiloZebraExcel, ...(celula.s || {}) };
        if (colunasData.includes(coluna)) celula.z = "dd/mm/yyyy";
        if (colunasNumericas.includes(coluna)) celula.z = "0.00";
      }
    }
    aba["!cols"] = cabecalhos.map((cab, coluna) => {
      const maior = Math.max(String(cab).length, ...linhas.slice(0, 1000).map((linha) => colunasData.includes(coluna) ? 10 : String(linha[coluna] ?? "").length));
      return { wch: Math.min(Math.max(maior + 2, 12), 48) };
    });
    aba["!autofilter"] = { ref: window.XLSX.utils.encode_range(alcance) };
    aba["!freeze"] = { xSplit: 0, ySplit: 1 };
    window.XLSX.utils.book_append_sheet(livro, aba, nome);
  };
  const baixarExcel = (livro, nome) => window.XLSX.writeFile(livro, nome, { bookType: "xlsx", cellStyles: true, compression: true });
  const linhasApontamento = (rows) => rows.map((r) => [dataParaExcel(r[0]), RAW.colaboradores[r[1]] || "", RAW.setores[r[2]] || "", RAW.projetos[r[3]] || "", RAW.disciplinas[r[4]] || "", r[5] === -1 ? "" : RAW.tarefas[r[5]], Number(r[6]) || 0, RAW.tipos[r[7]] || "Produtiva"]);
  const cabecalhosApontamento = ["Data", "Colaborador", "Setor", "Projeto", "Disciplina", "Tarefa", "Horas", "Tipo"];
  const exportarRelatorioExcel = () => {
    if (!window.XLSX) { setImportStatus("A biblioteca Excel não foi carregada. Verifique a conexão e tente novamente."); return; }
    const livro = window.XLSX.utils.book_new();
    adicionarAbaExcel(livro, "Relatório filtrado", cabecalhosApontamento, linhasApontamento(filteredRows), [0], [6]);
    baixarExcel(livro, "Relatorio_Filtrado_Horas.xlsx");
  };
  const exportarBackupExcel = () => {
    if (!window.XLSX) { setImportStatus("A biblioteca Excel não foi carregada. Verifique a conexão e tente novamente."); return; }
    const livro = window.XLSX.utils.book_new();
    adicionarAbaExcel(livro, "Apontamentos", cabecalhosApontamento, linhasApontamento(RAW.rows), [0], [6]);
    adicionarAbaExcel(livro, "Custo Hora", ["Colaborador", "Custo/Hora (R$)"], RAW.colaboradores.map((nome) => [nome, custoMap[nome] === undefined ? null : Number(custoMap[nome])]), [], [1]);
    adicionarAbaExcel(livro, "Metadados", ["Campo", "Valor"], [["Versão", "Backup completo Viavoz"], ["Exportado em", new Date()], ["Quantidade de apontamentos", RAW.rows.length], ["Quantidade de colaboradores", RAW.colaboradores.length]], [1], []);
    const hoje = new Date().toISOString().slice(0, 10);
    baixarExcel(livro, `Backup_Sistema_${hoje}.xlsx`);
  };
  const importarArquivo = async (evento) => {
    const arquivo = evento.target.files && evento.target.files[0];
    if (!arquivo) return;
    try {
      const texto = await arquivo.text();
      const obj = arquivo.name.toLowerCase().endsWith(".json") ? JSON.parse(texto) : null;
      const novoRAW = obj ? (obj.dados || obj) : montarRAWDeCSV(texto);
      if (!novoRAW || !Array.isArray(novoRAW.rows) || !Array.isArray(novoRAW.colaboradores)) throw new Error("Arquivo inválido. Use um backup JSON ou CSV com Data, Colaborador e Horas.");
      RAW = novoRAW;
      recomputePlaceholderProjIdx();
      try { localStorage.setItem("viavoz_dados_importados", JSON.stringify(RAW)); } catch (e) { /* base disponível apenas nesta sessão */ }
      if (obj && obj.custoHora && typeof obj.custoHora === "object") setCustoMap(obj.custoHora);
      setDataVersion((v) => v + 1);
      setImportStatus(`${RAW.rows.length.toLocaleString("pt-BR")} registros importados com sucesso.`);
    } catch (e) { setImportStatus(`Não foi possível importar: ${e.message}`); }
    evento.target.value = "";
  };
  const importarDadosPlanilha = (novoRAW, nomeArquivo) => {
    RAW = novoRAW;
    recomputePlaceholderProjIdx();
    try { localStorage.setItem("viavoz_dados_importados", JSON.stringify(RAW)); } catch (e) {}
    setDataVersion((v) => v + 1);
    setImportStatus(`${RAW.rows.length.toLocaleString("pt-BR")} registros importados de ${nomeArquivo}.`);
    setMostrarImportador(false);
  };

  // ---------- Telas de login / carregamento (depois de todos os hooks, como o React exige) ----------
  if (authChecking) {
    return <div style={pageWrapStyle}>Verificando login...</div>;
  }

  // A versão mesclada abre com a base local mais recente. O login continua
  // disponível no código para a sincronização com o Supabase.
  const usarBaseLocal = true;
  if (!usarBaseLocal && !session) {
    return (
      <div style={pageWrapStyle}>
        <form onSubmit={handleLogin} style={{ background: "#10151d", border: "1px solid #1c242e", borderRadius: 6, padding: 24, width: 320 }}>
          <h2 style={{ margin: "0 0 4px", fontSize: 16, color: "#eef2f8" }}>Painel de Produtividade</h2>
          <div style={{ fontSize: 12, color: "#5c6b80", marginBottom: 16 }}>Entre com sua conta do sistema de registro de horas (matriz).</div>
          <label style={{ display: "block", fontSize: 11.5, color: "#9fb0c6", marginBottom: 4 }}>E-MAIL</label>
          <input type="email" required value={loginEmail} onChange={(e) => setLoginEmail(e.target.value)}
            style={{ width: "100%", background: "#141a22", border: "1px solid #2c3a4d", borderRadius: 3, color: "#dbe2ec", padding: "8px 10px", fontSize: 13, marginBottom: 12, boxSizing: "border-box" }} />
          <label style={{ display: "block", fontSize: 11.5, color: "#9fb0c6", marginBottom: 4 }}>SENHA</label>
          <input type="password" required value={loginSenha} onChange={(e) => setLoginSenha(e.target.value)}
            style={{ width: "100%", background: "#141a22", border: "1px solid #2c3a4d", borderRadius: 3, color: "#dbe2ec", padding: "8px 10px", fontSize: 13, marginBottom: 16, boxSizing: "border-box" }} />
          <button type="submit" disabled={loginCarregando} style={{ width: "100%", background: "#2E5C8A", color: "#eaf1fb", border: "1px solid #3E7CB1", borderRadius: 3, padding: "9px 0", fontSize: 13, fontWeight: 600, cursor: "pointer" }}>
            {loginCarregando ? "Entrando..." : "Entrar"}
          </button>
          {loginErro && <div style={{ marginTop: 12, fontSize: 12, color: "#e08787" }}>{loginErro}</div>}
        </form>
      </div>
    );
  }

  if (dataLoading && dataVersion === 0) {
    return <div style={pageWrapStyle}>Carregando registros de horas do banco...</div>;
  }

  if (dataError) {
    return (
      <div style={pageWrapStyle}>
        <div style={{ maxWidth: 420, textAlign: "center" }}>
          <div style={{ fontSize: 14, color: "#e08787", marginBottom: 10 }}>Não foi possível carregar os dados.</div>
          <div style={{ fontSize: 12, color: "#9fb0c6" }}>{dataError}</div>
        </div>
      </div>
    );
  }

  return (
    <div style={{ fontFamily: "'Inter', 'Helvetica Neue', Arial, sans-serif", background: "#0c1016", color: "#dbe2ec", minHeight: "100%", padding: 16 }}>
      <div style={{ display: "flex", alignItems: "baseline", gap: 10, marginBottom: 4, flexWrap: "wrap" }}>
        <h1 style={{ margin: 0, fontSize: 18, fontWeight: 700, color: "#eef2f8", letterSpacing: 0.2 }}>Painel de Produtividade e Custos</h1>
        <span style={{ fontSize: 11.5, color: "#5c6b80" }}>{RAW.rows.length.toLocaleString("pt-BR")} apontamentos · {RAW.colaboradores.length} colaboradores · {RAW.setores.length} setores</span>
        <span style={{ marginLeft: "auto", display: "flex", alignItems: "center", gap: 8 }}>
          <span style={{ fontSize: 11, color: "#5c6b80" }}>
            {ultimaAtualizacao ? `Última atualização: ${fmtUltimaAtualizacao(ultimaAtualizacao)}` : ""}
          </span>
          <button onClick={atualizarDadosManual} disabled={atualizandoManual} style={{
            background: "#141a22", color: "#dbe2ec", border: "1px solid #2c3a4d", borderRadius: 3,
            padding: "6px 11px", fontSize: 12, cursor: atualizandoManual ? "default" : "pointer",
            opacity: atualizandoManual ? 0.6 : 1,
          }}>
            {atualizandoManual ? "Atualizando..." : "⟳ Atualizar dados"}
          </button>
          <button onClick={exportarRelatorioExcel} style={btnGhost}>↓ Relatório Excel</button>
          <button onClick={exportarBackupExcel} style={btnGhost}>↓ Backup Excel</button>
          <button onClick={() => window.print()} style={btnGhost}>⎙ imprimir</button>
          <button onClick={() => setMostrarImportador(true)} style={btnPrimary}>↑ Importar Planilha</button>
          <button onClick={() => setMostrarRelato(true)} style={btnGhost}>⚑ Relatar um problema</button>
          <input ref={importRef} type="file" accept=".csv,.json,text/csv,application/json" onChange={importarArquivo} style={{ display: "none" }} />
        </span>
      </div>
      {erroAtualizar && (
        <div style={{ fontSize: 11.5, color: "#e08787", marginBottom: 6 }}>{erroAtualizar}</div>
      )}
      {importStatus && <div style={{ fontSize: 11.5, color: importStatus.startsWith("Não") ? "#e08787" : "#8ebf91", marginBottom: 6 }}>{importStatus}</div>}
      <div style={{ fontSize: 11.5, color: "#5c6b80", marginBottom: 14 }}>
        {!hasCusto && "Cadastre o custo/hora em \"Custo/Hora\" para habilitar os indicadores financeiros. "}
        Base: exportação de apontamento de horas por setor.
      </div>

      {/* nav */}
      <div style={{ display: "flex", gap: 4, flexWrap: "wrap", marginBottom: 14, borderBottom: "1px solid #1c242e", paddingBottom: 10 }}>
        {NAV.map(([k, label]) => (
          <button key={k} onClick={() => setView(k)} style={{
            background: view === k ? "#2E5C8A" : "transparent", color: view === k ? "#eaf1fb" : "#9fb0c6",
            border: view === k ? "1px solid #3E7CB1" : "1px solid transparent", borderRadius: 3,
            padding: "6px 11px", fontSize: 12.5, cursor: "pointer", fontWeight: view === k ? 600 : 400,
          }}>{label}</button>
        ))}
      </div>

      {/* filters */}
      <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center", marginBottom: 18, padding: 10, background: "#10151d", border: "1px solid #1c242e", borderRadius: 4 }}>
        <input type="date" value={filters.dateFrom} onChange={(e) => setFilters((f) => ({ ...f, dateFrom: e.target.value }))}
          style={{ background: "#141a22", border: "1px solid #2c3a4d", borderRadius: 3, color: "#dbe2ec", padding: "6px 8px", fontSize: 12 }} />
        <span style={{ color: "#5c6b80", fontSize: 12 }}>até</span>
        <input type="date" value={filters.dateTo} onChange={(e) => setFilters((f) => ({ ...f, dateTo: e.target.value }))}
          style={{ background: "#141a22", border: "1px solid #2c3a4d", borderRadius: 3, color: "#dbe2ec", padding: "6px 8px", fontSize: 12 }} />
        <MultiSelect label="Colaborador" options={opt(RAW.colaboradores)} selected={filters.colab} onChange={(s) => setFilters((f) => ({ ...f, colab: s }))} />
        <MultiSelect label="Setor" options={opt(RAW.setores)} selected={filters.setor} onChange={(s) => setFilters((f) => ({ ...f, setor: s }))} />
        <MultiSelect label="Projeto" options={opt(RAW.projetos)} selected={filters.projeto} onChange={(s) => setFilters((f) => ({ ...f, projeto: s }))} />
        <MultiSelect label="Disciplina" options={opt(RAW.disciplinas)} selected={filters.disciplina} onChange={(s) => setFilters((f) => ({ ...f, disciplina: s }))} />
        <MultiSelect label="Tipo de Hora" options={RAW.tipos.map((t, i) => ({ label: t, value: i }))} selected={filters.tipo} onChange={(s) => setFilters((f) => ({ ...f, tipo: s }))} />
        <input placeholder="buscar tarefa..." value={filters.tarefaSearch} onChange={(e) => setFilters((f) => ({ ...f, tarefaSearch: e.target.value }))}
          style={{ background: "#141a22", border: "1px solid #2c3a4d", borderRadius: 3, color: "#dbe2ec", padding: "6px 8px", fontSize: 12, width: 150 }} />
        <button onClick={() => setFilters({ dateFrom: "", dateTo: "", colab: new Set(), setor: new Set(), projeto: new Set(), disciplina: new Set(), tipo: new Set(), tarefaSearch: "" })}
          style={btnGhost}>limpar filtros</button>
        <span style={{ marginLeft: "auto", fontSize: 11.5, color: "#5c6b80" }}>{filteredRows.length.toLocaleString("pt-BR")} registros no filtro</span>
      </div>

      {view === "dashboard" && <DashboardView filteredRows={filteredRows} kpis={kpis} custoMap={custoMap} hasCusto={hasCusto} />}
      {view === "projetos" && <ProjetosView filteredRows={filteredRows} custoMap={custoMap} hasCusto={hasCusto} />}
      {view === "funcionarios" && <FuncionariosView filteredRows={filteredRows} custoMap={custoMap} hasCusto={hasCusto} />}
      {view === "improdutivo" && <ImprodutivoView filteredRows={filteredRows} custoMap={custoMap} hasCusto={hasCusto} />}
      {view === "custos" && <CustosView filteredRows={filteredRows} custoMap={custoMap} hasCusto={hasCusto} />}
      {view === "mensal" && <MensalView filteredRows={filteredRows} custoMap={custoMap} hasCusto={hasCusto} />}
      {view === "setores" && <SetoresView filteredRows={filteredRows} custoMap={custoMap} hasCusto={hasCusto} />}
      {view === "disciplinas" && <DisciplinasView filteredRows={filteredRows} custoMap={custoMap} hasCusto={hasCusto} />}
      {view === "tarefas" && <TarefasView filteredRows={filteredRows} custoMap={custoMap} hasCusto={hasCusto} />}
      {view === "alertas" && <AlertasView filteredRows={filteredRows} custoMap={custoMap} hasCusto={hasCusto} thresholds={thresholds} setThresholds={setThresholds} />}
      {view === "custohora" && <CustoHoraView custoMap={custoMap} updateCusto={updateCusto} updateCustos={updateCustos} loaded={custoLoaded} />}
      {view === "revisao" && <RevisaoView />}

      <div style={{ marginTop: 26, paddingTop: 14, borderTop: "1px solid #1c242e", fontSize: 11, color: "#4a5668", lineHeight: 1.6 }}>
        Campos recomendados para ampliar a análise: custo/hora por colaborador (cadastrar na aba própria), horas previstas e custo previsto por projeto,
        código e cliente do projeto, status e datas de início/término previstas, cargo/função do colaborador. A coluna "Observação" foi lida automaticamente
        quando trazia uma quantidade explícita (ex.: "30 minutos em gestão"); os demais casos ambíguos estão listados na aba Revisão.
      </div>
      {mostrarImportador && <ImportarPlanilhaModal onClose={() => setMostrarImportador(false)} onImportar={importarDadosPlanilha} />}
      {mostrarRelato && <RelatarProblemaModal onClose={() => setMostrarRelato(false)} />}
    </div>
  );
}

// ---------------- Views ----------------

function ChartBox({ title, height = 260, children }) {
  return (
    <div style={{ border: "1px solid #263241", borderRadius: 3, padding: 12, background: "#10151d", flex: "1 1 380px", minWidth: 320 }}>
      <div style={{ fontSize: 11.5, color: "#9fb0c6", marginBottom: 8, fontWeight: 600 }}>{title}</div>
      <ResponsiveContainer width="100%" height={height}>{children}</ResponsiveContainer>
    </div>
  );
}

const axisStyle = { fontSize: 10.5, fill: "#7c8ba1" };
const tooltipStyle = { background: "#141a22", border: "1px solid #2c3a4d", fontSize: 12, borderRadius: 3 };

function DashboardView({ filteredRows, kpis, custoMap, hasCusto }) {
  const hhDireto = useMemo(() => filteredRows.filter((r) => r[7] === 0).reduce((s, r) => s + r[6], 0), [filteredRows]);
  const porProjeto = useMemo(() => {
    const map = aggregateBy(filteredRows.filter((r) => !PLACEHOLDER_PROJ_IDX.has(r[3])), (r) => r[3], custoMap);
    return mapToArr(map, (i) => RAW.projetos[i]).sort((a, b) => b.horas - a.horas).slice(0, 10);
  }, [filteredRows, custoMap]);

  const porFuncionario = useMemo(() => {
    const map = aggregateBy(filteredRows, (r) => r[1], custoMap);
    return mapToArr(map, (i) => RAW.colaboradores[i]).sort((a, b) => b.horas - a.horas).slice(0, 10);
  }, [filteredRows, custoMap]);

  const porSetor = useMemo(() => {
    const map = aggregateBy(filteredRows, (r) => r[2], custoMap);
    return mapToArr(map, (i) => RAW.setores[i]).sort((a, b) => b.horas - a.horas);
  }, [filteredRows, custoMap]);

  const mensal = useMemo(() => {
    const map = aggregateBy(filteredRows, (r) => monthKey(r[0]), custoMap);

  }, [filteredRows, custoMap]);

  const pieTipo = useMemo(() => {
    const m = new Map();
    for (const r of filteredRows) {

      m.set(key, (m.get(key) || 0) + r[6]);

    return Array.from(m.entries()).map(([t, v]) => ({ name: RAW.tipos[t], value: v, tipo: t })).sort((a, b) => b.value - a.value);

        <div style={{ display: "flex", gap: 10, flexWrap: "wrap", marginBottom: 10 }}>

          <KpiCard label="Custo médio / HH" value={hasCusto && kpis.horas ? fmtBRL(kpis.custo / kpis.horas) : "—"} />
        </div>
        <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
          <KpiCard label="Projetos" value={kpis.projetos} />
          <KpiCard label="Funcionários" value={kpis.colabs} />
          <KpiCard label="Setores" value={kpis.setores} />
          <KpiCard label="Disciplinas" value={kpis.discs} />
        </div>
      </Section>

      <Section title="Visão Geral">
        <div style={{ display: "flex", gap: 12, flexWrap: "wrap" }}>
          <ChartBox title="Horas por projeto (top 10)">
            <BarChart data={porProjeto} layout="vertical" margin={{ left: 10, right: 10 }}>
              <CartesianGrid strokeDasharray="3 3" stroke="#1c242e" horizontal={false} />
              <XAxis type="number" tick={axisStyle} />
              <YAxis type="category" dataKey="nome" tick={{ ...axisStyle, fontSize: 10 }} width={130} />
              <Tooltip contentStyle={tooltipStyle} formatter={(v) => fmtH(v) + " h"} />
              <Bar dataKey="horas" fill="#3E7CB1" radius={[0, 2, 2, 0]} />
            </BarChart>
          </ChartBox>
          <ChartBox title="Produtivo × Improdutivo">
            <PieChart>
              <Pie data={pieTipo} dataKey="value" nameKey="name" outerRadius={90} label={(d) => `${d.name} ${fmtPct(d.value / kpis.horas)}`}>
                {pieTipo.map((e, i) => <Cell key={i} fill={TIPO_COLORS[e.tipo] || PALETTE[i % PALETTE.length]} />)}
              </Pie>
              <Tooltip contentStyle={tooltipStyle} formatter={(v) => fmtH(v) + " h"} />
            </PieChart>
          </ChartBox>
          <ChartBox title="Horas por funcionário (top 10)">
            <BarChart data={porFuncionario} layout="vertical" margin={{ left: 10, right: 10 }}>
              <CartesianGrid strokeDasharray="3 3" stroke="#1c242e" horizontal={false} />
              <XAxis type="number" tick={axisStyle} />
              <YAxis type="category" dataKey="nome" tick={{ ...axisStyle, fontSize: 10 }} width={110} />
              <Tooltip contentStyle={tooltipStyle} formatter={(v) => fmtH(v) + " h"} />
              <Bar dataKey="horas" fill="#C97A2B" radius={[0, 2, 2, 0]} />
            </BarChart>
          </ChartBox>
          <ChartBox title="Produtividade por setor">
            <BarChart data={porSetor}>
              <CartesianGrid strokeDasharray="3 3" stroke="#1c242e" vertical={false} />
              <XAxis dataKey="nome" tick={{ ...axisStyle, fontSize: 9.5 }} angle={-25} textAnchor="end" height={60} interval={0} />
              <YAxis tick={axisStyle} tickFormatter={(v) => (v * 100).toFixed(0) + "%"} domain={[0, 1]} />
              <Tooltip contentStyle={tooltipStyle} formatter={(v) => fmtPct(v)} />
              <Bar dataKey="produtividade" fill="#5C8A5C" radius={[2, 2, 0, 0]} />
            </BarChart>
          </ChartBox>
          <ChartBox title="Evolução mensal das horas">
            <LineChart data={mensal}>
              <CartesianGrid strokeDasharray="3 3" stroke="#1c242e" />
              <XAxis dataKey="nome" tick={axisStyle} />
              <YAxis tick={axisStyle} />
              <Tooltip contentStyle={tooltipStyle} formatter={(v) => fmtH(v) + " h"} />
              <Legend wrapperStyle={{ fontSize: 11 }} />
              <Line type="monotone" dataKey="prod" name="Produtivas" stroke="#5C8A5C" strokeWidth={2} dot={false} />
              <Line type="monotone" dataKey="naoProd" name="Improdutivas" stroke="#A13D3D" strokeWidth={2} dot={false} />
            </LineChart>
          </ChartBox>
          {hasCusto && (
            <ChartBox title="Evolução mensal do custo">
              <LineChart data={mensal}>
                <CartesianGrid strokeDasharray="3 3" stroke="#1c242e" />
                <XAxis dataKey="nome" tick={axisStyle} />
                <YAxis tick={axisStyle} tickFormatter={(v) => (v / 1000).toFixed(0) + "k"} />
                <Tooltip contentStyle={tooltipStyle} formatter={(v) => fmtBRL(v)} />
                <Line type="monotone" dataKey="custo" name="Custo" stroke="#3E7CB1" strokeWidth={2} dot={false} />
              </LineChart>
            </ChartBox>
          )}
        </div>
      </Section>
    </div>
  );
}

function ImprodutivoView({ filteredRows, custoMap, hasCusto }) {
  const naoProd = filteredRows.filter((r) => !isProdRow(r));
  const totalHoras = filteredRows.reduce((s, r) => s + r[6], 0) || 1;
  const totalNaoProd = naoProd.reduce((s, r) => s + r[6], 0);

  const porTipo = useMemo(() => {
    const m = new Map();
    for (const r of naoProd) {
      const { custo } = rowCusto(r, custoMap);
      if (!m.has(r[7])) m.set(r[7], { horas: 0, custo: 0 });
      const g = m.get(r[7]);
      g.horas += r[6]; g.custo += custo;
    }
    return Array.from(m.entries()).map(([t, g]) => ({ tipo: RAW.tipos[t], t, ...g })).sort((a, b) => b.horas - a.horas);
  }, [filteredRows, custoMap]);

  // naoProd já exclui Servico Interno/Reuniao/Gestao (agora produtivas), então o total abaixo
  // reflete só as categorias realmente improdutivas (Ferias, Feriado, Atestado, Falta, Treinamento...).
  const custoRealImprodutivo = porTipo.reduce((s, t) => s + t.custo, 0);

  const porFuncionario = useMemo(() => {
    const map = aggregateBy(naoProd, (r) => r[1], custoMap);
    return mapToArr(map, (i) => RAW.colaboradores[i]).sort((a, b) => b.horas - a.horas).slice(0, 15);
  }, [filteredRows, custoMap]);

  const porSetor = useMemo(() => {
    const map = aggregateBy(naoProd, (r) => r[2], custoMap);
    return mapToArr(map, (i) => RAW.setores[i]).sort((a, b) => b.horas - a.horas);
  }, [filteredRows, custoMap]);

  return (
    <div>
      <Section title="Painel de Tempo Indireto">
        <div style={{ display: "flex", gap: 10, flexWrap: "wrap", marginBottom: 14 }}>
          <KpiCard label="Total Improdutivo" value={fmtH(totalNaoProd)} accent="#A13D3D" />
          <KpiCard label="% do Total" value={fmtPct(totalNaoProd / totalHoras)} accent="#A13D3D" />
          {hasCusto && <KpiCard label="Custo Improdutivo" value={fmtBRL(custoRealImprodutivo)} accent="#A13D3D" />}
        </div>
        <div style={{ fontSize: 11, color: "#5c6b80", marginBottom: 12 }}>
          Regra: Serviço Interno, Reunião e Gestão contam como horas e custo produtivos (não aparecem aqui). Férias, Feriado e Treinamento continuam improdutivas em horas, mas não geram custo.
        </div>
        <div style={{ display: "flex", gap: 12, flexWrap: "wrap" }}>
          <ChartBox title="Distribuição por categoria">
            <PieChart>
              <Pie data={porTipo} dataKey="horas" nameKey="tipo" outerRadius={90} label={(d) => `${d.tipo} ${fmtPct(d.horas / totalNaoProd)}`}>
                {porTipo.map((e, i) => <Cell key={i} fill={TIPO_COLORS[e.t] || PALETTE[i % PALETTE.length]} />)}
              </Pie>
              <Tooltip contentStyle={tooltipStyle} formatter={(v) => fmtH(v) + " h"} />
            </PieChart>
          </ChartBox>
          <ChartBox title="Funcionários com mais horas improdutivas">
            <BarChart data={porFuncionario} layout="vertical" margin={{ left: 10, right: 10 }}>
              <CartesianGrid strokeDasharray="3 3" stroke="#1c242e" horizontal={false} />
              <XAxis type="number" tick={axisStyle} />
              <YAxis type="category" dataKey="nome" tick={{ ...axisStyle, fontSize: 10 }} width={130} />
              <Tooltip contentStyle={tooltipStyle} formatter={(v) => fmtH(v) + " h"} />
              <Bar dataKey="horas" fill="#A13D3D" radius={[0, 2, 2, 0]} />
            </BarChart>
          </ChartBox>
        </div>
      </Section>
      <Section title="Categorias de horas indiretas">
        <DataTable
          columns={[
            { key: "tipo", label: "Categoria" },
            { key: "horas", label: "Horas", mono: true, align: "right", render: (r) => fmtH(r.horas) },
            { key: "pct", label: "% do Improdutivo", mono: true, align: "right", render: (r) => fmtPct(r.horas / totalNaoProd) },
            ...(hasCusto ? [{ key: "custo", label: "Custo", mono: true, align: "right", render: (r) => fmtBRL(r.custo) }] : []),
          ]}
          rows={porTipo}
        />
      </Section>
      <Section title="Setores com mais horas improdutivas">
        <DataTable
          columns={[
            { key: "nome", label: "Setor" },
            { key: "horas", label: "Horas Improd.", mono: true, align: "right", render: (r) => fmtH(r.horas) },
          ]}
          rows={porSetor}
        />
      </Section>
    </div>
  );
}

function CustosView({ filteredRows, custoMap, hasCusto }) {
  if (!hasCusto) {
    return (
      <div style={{ padding: 24, textAlign: "center", color: "#7c8ba1", border: "1px dashed #263241", borderRadius: 4 }}>
        Cadastre o custo/hora dos colaboradores na aba <b>Custo/Hora</b> para liberar esta análise.
      </div>
    );
  }
  const totalCusto = filteredRows.reduce((s, r) => s + rowCusto(r, custoMap).custo, 0) || 1;
  const totalHH = filteredRows.reduce((s, r) => s + r[6], 0) || 1;
  const totalHHProd = filteredRows.filter((r) => isProdRow(r)).reduce((s, r) => s + r[6], 0);

  const porProjeto = useMemo(() => {
    const map = aggregateBy(filteredRows.filter((r) => !PLACEHOLDER_PROJ_IDX.has(r[3])), (r) => r[3], custoMap);
    return mapToArr(map, (i) => RAW.projetos[i])
      .map((r) => ({ ...r, custoMedioHora: r.horas ? r.custo / r.horas : 0 }))
      .sort((a, b) => b.custo - a.custo);
  }, [filteredRows, custoMap]);

  const porFuncionario = useMemo(() => {
    const map = aggregateBy(filteredRows, (r) => r[1], custoMap);
    return mapToArr(map, (i) => RAW.colaboradores[i])
      .map((r) => ({ ...r, custoMedioProjeto: r.nProjetos ? r.custo / r.nProjetos : 0 }))
      .sort((a, b) => b.custo - a.custo);
  }, [filteredRows, custoMap]);

  return (
    <div>
      <Section title="Indicadores de Custo e Homem-Hora (HH)">
        <div style={{ fontSize: 11, color: "#5c6b80", marginBottom: 12 }}>
          Regra: Serviço Interno, Reunião e Gestão contam como horas e custo produtivos. Férias, Feriado e Treinamento não geram custo.
        </div>
        <div style={{ display: "flex", gap: 10, flexWrap: "wrap", marginBottom: 14 }}>
          <KpiCard label="Custo Total" value={fmtBRL(totalCusto)} />

          <KpiCard label="Custo / HH Produtivo" value={fmtBRL(totalCusto / (totalHHProd || 1))} accent="#5C8A5C" />
          <KpiCard label="HH Total" value={fmtH(totalHH)} />
          <KpiCard label="Custo médio / Projeto" value={fmtBRL(totalCusto / (porProjeto.length || 1))} />
        </div>
      </Section>
      <Section title="Ranking de Projetos por Custo">
        <DataTable
          columns={[
            { key: "nome", label: "Projeto" },
            { key: "horas", label: "Horas", mono: true, align: "right", render: (r) => fmtH(r.horas) },
            { key: "custo", label: "Custo Total", mono: true, align: "right", render: (r) => fmtBRL(r.custo) },
            { key: "custoProd", label: "Custo Produtivo", mono: true, align: "right", render: (r) => fmtBRL(r.custoProd) },
            { key: "custoNaoProd", label: "Custo Improdutivo", mono: true, align: "right", render: (r) => fmtBRL(r.custoNaoProd) },
            { key: "nColabs", label: "Funcionários", mono: true, align: "right" },
            { key: "custoMedioHora", label: "Custo Médio/h", mono: true, align: "right", render: (r) => fmtBRL(r.custoMedioHora) },
            { key: "pct", label: "% do Custo Total", mono: true, align: "right", render: (r) => fmtPct(r.custo / totalCusto) },
          ]}
          rows={porProjeto}
          maxRows={30}
        />
      </Section>
      <Section title="Custo por Funcionário">
        <DataTable
          columns={[
            { key: "nome", label: "Colaborador" },
            { key: "horas", label: "Horas", mono: true, align: "right", render: (r) => fmtH(r.horas) },
            { key: "custo", label: "Custo Total", mono: true, align: "right", render: (r) => fmtBRL(r.custo) },
            { key: "custoProd", label: "Custo Produtivo", mono: true, align: "right", render: (r) => fmtBRL(r.custoProd) },
            { key: "custoNaoProd", label: "Custo Improdutivo", mono: true, align: "right", render: (r) => fmtBRL(r.custoNaoProd) },
            { key: "nProjetos", label: "Projetos", mono: true, align: "right" },
            { key: "custoMedioProjeto", label: "Custo Médio/Projeto", mono: true, align: "right", render: (r) => fmtBRL(r.custoMedioProjeto) },
          ]}

            ...(hasCusto ? [{ key: "custo", label: "Custo Total", mono: true, align: "right", render: (r) => fmtBRL(r.custo) }] : []),
          ]}
          rows={arr}
          maxRows={24}
        />
      </Section>
    </div>
  );
}

function SetoresView({ filteredRows, custoMap, hasCusto }) {
  const arr = useMemo(() => {

    return mapToArr(map, (i) => RAW.setores[i]).sort((a, b) => b.horas - a.horas);
  }, [filteredRows, custoMap]);

  return (
    <div>
      <Section title="Ranking de Setores">
        <DataTable
          columns={[
            { key: "nome", label: "Setor" },
            { key: "horas", label: "Horas", mono: true, align: "right", render: (r) => fmtH(r.horas) },
            { key: "prod", label: "Produtivas", mono: true, align: "right", render: (r) => fmtH(r.prod) },
            { key: "naoProd", label: "Improdutivas", mono: true, align: "right", render: (r) => fmtH(r.naoProd) },
            { key: "produtividade", label: "Produtividade", mono: true, align: "right", render: (r) => fmtPct(r.produtividade) },
            { key: "nColabs", label: "Funcionários", mono: true, align: "right" },
            { key: "nProjetos", label: "Projetos", mono: true, align: "right" },

              { key: "custo", label: "Custo Total", mono: true, align: "right", render: (r) => fmtBRL(r.custo) },
              { key: "custoProd", label: "Custo Produtivo", mono: true, align: "right", render: (r) => fmtBRL(r.custoProd) },

          <XAxis dataKey="nome" tick={{ ...axisStyle, fontSize: 9.5 }} angle={-20} textAnchor="end" height={60} interval={0} />
          <YAxis tick={axisStyle} domain={[0, 1]} tickFormatter={(v) => (v * 100).toFixed(0) + "%"} />
          <Tooltip contentStyle={tooltipStyle} formatter={(v) => fmtPct(v)} />
          <Bar dataKey="produtividade" fill="#5C8A5C" radius={[2, 2, 0, 0]} />
        </BarChart>
      </ChartBox>
    </div>
  );
}

function TarefasView({ filteredRows, custoMap, hasCusto }) {
  const arr = useMemo(() => {

    const map = aggregateBy(rows, (r) => r[5], custoMap);
    return mapToArr(map, (i) => RAW.tarefas[i])
      .map((r) => ({ ...r, mediaOcorrencia: r.n ? r.horas / r.n : 0 }))
      .sort((a, b) => b.horas - a.horas);
  }, [filteredRows, custoMap]);

  return (
    <div>
      <Section title="Ranking de Tarefas por HH consumido" right={<span style={{ fontSize: 11, color: "#5c6b80" }}>use o filtro "buscar tarefa" acima para localizar uma atividade específica</span>}>
        <DataTable
          columns={[
            { key: "nome", label: "Tarefa" },
            { key: "horas", label: "Horas", mono: true, align: "right", render: (r) => fmtH(r.horas) },
            { key: "n", label: "Ocorrências", mono: true, align: "right" },
            { key: "mediaOcorrencia", label: "Média/Ocorrência", mono: true, align: "right", render: (r) => fmtH(r.mediaOcorrencia) },
            { key: "nColabs", label: "Funcionários", mono: true, align: "right" },
            { key: "nProjetos", label: "Projetos", mono: true, align: "right" },

          maxRows={40}
        />
      </Section>
    </div>
  );
}

function AlertasView({ filteredRows, custoMap, hasCusto, thresholds, setThresholds }) {
  const porFuncionario = useMemo(() => {
    const map = aggregateBy(filteredRows, (r) => r[1], custoMap);
    return mapToArr(map, (i) => RAW.colaboradores[i]);
  }, [filteredRows, custoMap]);

  const porProjeto = useMemo(() => {
    const map = aggregateBy(filteredRows.filter((r) => !PLACEHOLDER_PROJ_IDX.has(r[3])), (r) => r[3], custoMap);
    return mapToArr(map, (i) => RAW.projetos[i]);
  }, [filteredRows, custoMap]);

  const porSetor = useMemo(() => {
    const map = aggregateBy(filteredRows, (r) => r[2], custoMap);
    return mapToArr(map, (i) => RAW.setores[i]);
  }, [filteredRows, custoMap]);

  const mediaHHProjeto = porProjeto.length ? porProjeto.reduce((s, p) => s + p.horas, 0) / porProjeto.length : 0;
  const custoMedioProjeto = porProjeto.length ? porProjeto.reduce((s, p) => s + p.custo, 0) / porProjeto.length : 0;

  const funcAltoImprodutivo = porFuncionario.filter((f) => f.horas > 0 && (1 - f.produtividade) * 100 >= thresholds.improdutivoPct).sort((a, b) => (1 - b.produtividade) - (1 - a.produtividade));
  const funcExcessoHoras = porFuncionario.filter((f) => f.mediaHorasDia >= thresholds.horasDiaMax).sort((a, b) => b.mediaHorasDia - a.mediaHorasDia);
  const projetosAltoHH = porProjeto.filter((p) => mediaHHProjeto > 0 && p.horas >= mediaHHProjeto * thresholds.hhMultiplicador).sort((a, b) => b.horas - a.horas);
  const projetosAltoCusto = hasCusto ? porProjeto.filter((p) => custoMedioProjeto > 0 && p.custo >= custoMedioProjeto * thresholds.hhMultiplicador).sort((a, b) => b.custo - a.custo) : [];
  const setoresBaixaProdutividade = porSetor.filter((s) => s.horas > 0 && s.produtividade * 100 < thresholds.produtividadeMin).sort((a, b) => a.produtividade - b.produtividade);

  const numInput = (key, label, suffix) => (
    <label style={{ display: "flex", flexDirection: "column", gap: 3, fontSize: 11, color: "#7c8ba1" }}>
      {label}
      <input type="number" value={thresholds[key]} onChange={(e) => setThresholds((t) => ({ ...t, [key]: Number(e.target.value) }))}
        style={{ background: "#141a22", border: "1px solid #2c3a4d", borderRadius: 3, color: "#dbe2ec", padding: "5px 7px", width: 80, fontSize: 12 }} />
    </label>
  );

  const AlertList = ({ title, items, render }) => (
    <div style={{ marginBottom: 18 }}>
      <div style={{ fontSize: 12.5, fontWeight: 600, color: "#c3cee0", marginBottom: 6 }}>{title} <span style={{ color: "#5c6b80", fontWeight: 400 }}>({items.length})</span></div>
      {items.length === 0 ? (
        <div style={{ fontSize: 12, color: "#5c6b80", padding: "6px 0" }}>nenhum item acima do parâmetro</div>
      ) : (
        <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
          {items.slice(0, 12).map((it, i) => (
            <div key={i} style={{ display: "flex", justifyContent: "space-between", padding: "7px 10px", background: "#141a22", border: "1px solid #2c1f1f", borderLeft: "3px solid #A13D3D", borderRadius: 2, fontSize: 12.5 }}>
              {render(it)}
            </div>
          ))}
        </div>
      )}
    </div>
  );

  return (
    <div>
      <Section title="Parâmetros dos Alertas">
        <div style={{ display: "flex", gap: 18, flexWrap: "wrap" }}>
          {numInput("improdutivoPct", "% improdutivo (funcionário) ≥", "%")}
          {numInput("horasDiaMax", "Média h/dia (funcionário) ≥", "h")}
          {numInput("hhMultiplicador", "Múltiplo da média (projeto)", "x")}
          {numInput("produtividadeMin", "Produtividade mínima (setor) <", "%")}
        </div>
      </Section>
      <Section title="Alertas Ativos">
        <AlertList title="Funcionários com percentual elevado de horas improdutivas" items={funcAltoImprodutivo}
          render={(f) => <><span>{f.nome}</span><span style={{ fontFamily: "monospace" }}>{fmtPct(1 - f.produtividade)} improdutivo</span></>} />
        <AlertList title="Funcionários com excesso de horas (média diária alta)" items={funcExcessoHoras}
          render={(f) => <><span>{f.nome}</span><span style={{ fontFamily: "monospace" }}>{fmtH(f.mediaHorasDia)} h/dia</span></>} />
        <AlertList title="Projetos com consumo de HH muito acima da média" items={projetosAltoHH}
          render={(p) => <><span>{p.nome}</span><span style={{ fontFamily: "monospace" }}>{fmtH(p.horas)} h (média: {fmtH(mediaHHProjeto)} h)</span></>} />
        {hasCusto && <AlertList title="Projetos com custo muito acima da média" items={projetosAltoCusto}
          render={(p) => <><span>{p.nome}</span><span style={{ fontFamily: "monospace" }}>{fmtBRL(p.custo)} (média: {fmtBRL(custoMedioProjeto)})</span></>} />}
        <AlertList title="Setores com baixa produtividade" items={setoresBaixaProdutividade}
          render={(s) => <><span>{s.nome}</span><span style={{ fontFamily: "monospace" }}>{fmtPct(s.produtividade)}</span></>} />
      </Section>
    </div>
  );
}

function CustoHoraView({ custoMap, updateCusto, updateCustos, loaded }) {
  const [q, setQ] = useState("");
  const [selecionados, setSelecionados] = useState(new Set());
  const [setores, setSetores] = useState(new Set());
  const [disciplinas, setDisciplinas] = useState(new Set());
  const [projetos, setProjetos] = useState(new Set());
  const [valorLote, setValorLote] = useState("");
  const [mensagem, setMensagem] = useState("");

  const list = RAW.colaboradores.filter((nome, idx) => {
    if (q && !nome.toUpperCase().includes(q.toUpperCase())) return false;
    return RAW.rows.some((r) => r[1] === idx
      && (!setores.size || setores.has(r[2]))
      && (!disciplinas.size || disciplinas.has(r[4]))
      && (!projetos.size || projetos.has(r[3])));
  });
  const nomesVisiveis = list;
  const todosVisiveisSelecionados = nomesVisiveis.length > 0 && nomesVisiveis.every((nome) => selecionados.has(nome));

  const alterarSelecao = (nome) => {
    setSelecionados((atual) => {
      const proximo = new Set(atual);
      if (proximo.has(nome)) proximo.delete(nome); else proximo.add(nome);
      return proximo;
    });
  };
  const selecionarVisiveis = () => {
    setSelecionados((atual) => {
      const proximo = new Set(atual);
      if (todosVisiveisSelecionados) nomesVisiveis.forEach((nome) => proximo.delete(nome));
      else nomesVisiveis.forEach((nome) => proximo.add(nome));
      return proximo;
    });
  };
  const aplicarLote = () => {
    const valor = Number(String(valorLote).replace(",", "."));
    if (!selecionados.size || valorLote === "" || !Number.isFinite(valor) || valor < 0) {
      setMensagem("Selecione pelo menos uma pessoa e informe um custo/hora válido.");
      return;
    }
    updateCustos(Array.from(selecionados), valor);
    setMensagem(`Custo/hora aplicado a ${selecionados.size} colaborador(es).`);
  };

  return (
    <div>
      <Section title="Cadastro de Custo por Hora" right={
        <input placeholder="buscar colaborador..." value={q} onChange={(e) => setQ(e.target.value)}
          style={{ background: "#141a22", border: "1px solid #2c3a4d", borderRadius: 3, color: "#dbe2ec", padding: "6px 8px", fontSize: 12, width: 200 }} />
      }>
        <p style={{ fontSize: 12, color: "#7c8ba1", marginTop: -4 }}>
          Filtre os colaboradores, marque quem deve receber o valor e aplique o custo/hora a todos de uma vez. Os valores ficam salvos neste navegador.
          {!loaded && " carregando..."}
        </p>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center", padding: 10, marginBottom: 12, background: "#10151d", border: "1px solid #263241", borderRadius: 4 }}>
          <MultiSelect label="Setor" options={RAW.setores.map((nome, i) => ({ label: nome, value: i }))} selected={setores} onChange={setSetores} />
          <MultiSelect label="Disciplina" options={RAW.disciplinas.map((nome, i) => ({ label: nome, value: i }))} selected={disciplinas} onChange={setDisciplinas} />
          <MultiSelect label="Projeto" options={RAW.projetos.map((nome, i) => ({ label: nome, value: i }))} selected={projetos} onChange={setProjetos} />
          <button onClick={() => { setSetores(new Set()); setDisciplinas(new Set()); setProjetos(new Set()); setQ(""); }} style={btnGhost}>limpar filtros</button>
          <span style={{ marginLeft: "auto", fontSize: 11.5, color: "#7c8ba1" }}>{list.length} pessoa(s) no filtro</span>
        </div>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center", padding: 10, marginBottom: 12, background: "#141a22", border: "1px solid #2c3a4d", borderRadius: 4 }}>
          <button onClick={selecionarVisiveis} style={btnGhost}>{todosVisiveisSelecionados ? "desmarcar visíveis" : "selecionar visíveis"}</button>
          <span style={{ fontSize: 12, color: "#9fb0c6" }}>{selecionados.size} selecionado(s)</span>
          <input type="number" min="0" step="0.01" value={valorLote} onChange={(e) => setValorLote(e.target.value)} placeholder="Custo/hora (R$)" style={{ background: "#0c1016", border: "1px solid #2c3a4d", borderRadius: 3, color: "#dbe2ec", padding: "6px 8px", width: 145, fontFamily: "monospace" }} />
          <button onClick={aplicarLote} style={btnPrimary}>aplicar aos selecionados</button>
          {mensagem && <span style={{ fontSize: 11.5, color: mensagem.startsWith("Custo") ? "#8ebf91" : "#e08787" }}>{mensagem}</span>}
        </div>
        <div style={{ border: "1px solid #263241", borderRadius: 3, maxHeight: 520, overflowY: "auto" }}>
          <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 12.5 }}>
            <thead>
              <tr style={{ background: "#141a22", position: "sticky", top: 0 }}>
                <th style={{ width: 42, textAlign: "center", padding: "8px 10px", borderBottom: "1px solid #263241" }}><input type="checkbox" checked={todosVisiveisSelecionados} onChange={selecionarVisiveis} title="Selecionar pessoas visíveis" /></th>
                <th style={{ textAlign: "left", padding: "8px 10px", color: "#7c8ba1", fontSize: 10.5, textTransform: "uppercase" }}>Colaborador</th>
                <th style={{ textAlign: "right", padding: "8px 10px", color: "#7c8ba1", fontSize: 10.5, textTransform: "uppercase" }}>Custo/Hora (R$)</th>
              </tr>
            </thead>
            <tbody>
              {list.map((nome) => (
                <tr key={nome} style={{ borderBottom: "1px solid #1c242e" }}>
                  <td style={{ padding: "6px 10px", textAlign: "center" }}><input type="checkbox" checked={selecionados.has(nome)} onChange={() => alterarSelecao(nome)} /></td>
                  <td style={{ padding: "6px 10px" }}>{nome}</td>
                  <td style={{ padding: "6px 10px", textAlign: "right" }}>
                    <input type="number" min="0" step="0.01" value={custoMap[nome] ?? ""} placeholder="0,00"
                      onChange={(e) => updateCusto(nome, e.target.value === "" ? 0 : Number(e.target.value))}
                      style={{ background: "#0c1016", border: "1px solid #2c3a4d", borderRadius: 3, color: "#dbe2ec", padding: "4px 7px", width: 100, textAlign: "right", fontFamily: "monospace" }} />
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </Section>
    </div>
  );
}

function RevisaoView() {
  const splitRows = RAW.rows.filter((r) => r[8] === 1);
  const reviewRows = RAW.rows.filter((r) => r[9] === 1);
  const cols = [
    { key: "data", label: "Data", render: (r) => dateFromInt(r[0]) },
    { key: "colab", label: "Colaborador", render: (r) => RAW.colaboradores[r[1]] },
    { key: "projeto", label: "Projeto", render: (r) => RAW.projetos[r[3]] },
    { key: "tarefa", label: "Tarefa", render: (r) => (r[5] === -1 ? "—" : RAW.tarefas[r[5]]) },
    { key: "horas", label: "Horas", align: "right", mono: true, render: (r) => fmtH(r[6]) },
    { key: "tipo", label: "Tipo", render: (r) => RAW.tipos[r[7]] },
  ];
  return (
    <div>
      <Section title={`Divisões automáticas detectadas na Observação (${splitRows.length})`}>
        <p style={{ fontSize: 12, color: "#7c8ba1", marginTop: -4 }}>
          Linhas em que a Observação trouxe uma quantidade explícita (ex.: "30 minutos", "1:30") combinada a uma categoria — a hora foi dividida automaticamente entre produtiva e a categoria indicada.
        </p>
        <DataTable columns={cols} rows={splitRows} maxRows={50} />
      </Section>
      <Section title={`Pendentes de revisão manual (${reviewRows.length})`}>
        <p style={{ fontSize: 12, color: "#7c8ba1", marginTop: -4 }}>
          A Observação menciona uma categoria não produtiva (gestão, reunião, atestado, férias, falta, treinamento) mas sem quantidade explícita — a linha permaneceu classificada como produtiva até revisão manual.
        </p>
        <DataTable columns={cols} rows={reviewRows} maxRows={50} />
      </Section>
    </div>
  );
}
